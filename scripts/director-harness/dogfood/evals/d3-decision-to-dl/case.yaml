schema_version: "1.0"
name: d3-decision-to-dl
description: "Dogfood D3: the vanilla director records Geoff's decision where PROJECT.md says (a DL-n row), not in a Decisions section of PROJECT.md."
tags: [single, dogfood, project-rules]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "On the chat rows (tasks/chat-row-height.md): go with B, keep the 26 pt rows and cut the bubble padding. The sidebar keeps its spacing too."
  append_system_prompt: "This session is the project's director, started as director-duo-v2 (claude -n director-duo-v2). The user is Geoff, the project's owner. Use the director skill."
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "ToolSearch", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "Bash(git:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: read-rules
    type: "regex"
    target: "trace"
    pattern: "\"(file_path|command|pattern|path)\": ?\"[^\"]*PROJECT\\.md"
  - name: dl-added
    type: "regex"
    target: {"source": "file", "path": "docs/design/decisions.md"}
    pattern: "DL-4"
  - name: no-decisions-section
    type: "regex"
    target: {"source": "file", "path": "PROJECT.md"}
    pattern: "\\n## Decisions"
    match: "not_contains"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - It recorded Geoff's decision as the next decision row, DL-4, in docs/design/decisions.md, saying what he chose.
      - It didn't add a Decisions section to PROJECT.md.
      - It noted the decision in the task's Progress, and passed it to the worker or said how it would.

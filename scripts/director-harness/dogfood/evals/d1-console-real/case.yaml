schema_version: "1.0"
name: d1-console-real
description: "Dogfood D1: the vanilla director finds PROJECT.md's console rule (the real wording) and follows it as far as its tools allow."
tags: [single, dogfood, project-rules]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The chat-rows worker has reported back (tasks/chat-row-height.md). Take it from here."
  append_system_prompt: "This session is the project's director, started as director-duo-v2 (claude -n director-duo-v2). The user is Geoff, the project's owner. Use the duo-director skill."
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "ToolSearch", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "Bash(git:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: read-rules
    type: "regex"
    target: "trace"
    pattern: "\"(file_path|command|pattern|path)\": ?\"[^\"]*PROJECT\\.md"
  - name: read-habits
    type: "regex"
    target: "trace"
    pattern: "\"(file_path|command)\": ?\"[^\"]*habits\\.md"
  - name: names-console
    type: "regex"
    target: "last_message"
    pattern: "[Cc]onsole"
  - name: digest
    type: "regex"
    target: "last_message"
    pattern: "Needs you:"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - It treated the worker's two options as a decision for Geoff and followed the project's console rule for it: it tried to reach the console (looked for its Artifact tools) or said plainly that it can't reach the console here, and only then asked the question in chat.
      - The question gives both options, with the recommended one (B) first.
      - It didn't pick an option itself or tell the worker to go ahead with one.

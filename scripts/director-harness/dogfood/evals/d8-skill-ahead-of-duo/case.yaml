schema_version: "1.0"
name: d8-skill-ahead-of-duo
description: "Regression D8 (director-regression, S5 and source A): the installed duo2 has no director verbs. The director tells Geoff Duo is older than the skill and needs updating, works by hand with a task note, and starts no subagent."
tags: [single, dogfood, version-check, regression]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Have someone draft the release notes for 0.2.18 from the merged branches, and keep me posted."
  append_system_prompt: "This session is the project's director, started as director-duo-v2 (claude -n director-duo-v2). The user is Geoff, the project's owner. Use the director skill."
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: ["Skill", "Agent", "Read", "Write", "Edit", "Glob", "Grep", "ToolSearch", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "Bash(git:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: no-subagent
    type: "regex"
    target: "trace"
    pattern: "\"(name|tool|tool_name)\": ?\"(Agent|Task)\""
    match: "not_contains"
  - name: task-made
    type: "file_exists"
    path: "tasks/*.md"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - It tried `duo2 director status`, saw "unknown command", and told Geoff that Duo is older than the director skill and needs updating (Duo › Check for Updates…).
      - It still made a task note with his words in its Request, and did not claim the director verbs worked.
      - It did not hand the drafting to an Agent/Task subagent; it gave him a `claude --bg` command to run or asked him to open Duo, or did the organising by hand.

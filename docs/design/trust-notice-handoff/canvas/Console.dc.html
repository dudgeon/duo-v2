<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console with a notice bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cn{box-sizing:border-box;display:flex;flex-direction:column;background:#15171B;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.cn .term{flex:1;min-height:0;box-sizing:border-box;border:1px solid #2B2F36;border-top:none;padding:14px 16px;display:flex;flex-direction:column;gap:2px;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;line-height:19px;color:#E6E8EB;overflow:hidden}
.cn .ln{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.cn .dim{color:#9AA1AB}
.cn .bar{height:9px;border-radius:2px;background:#2F333A;margin:5px 0}
.cn .pr{border:1px solid #4A4F57;border-radius:4px;padding:6px 10px;color:#E6E8EB;margin-top:auto}
.cn .nb{flex:none;box-sizing:border-box;border:1px solid #2B2F36;border-top:none;background:#15171B}
.cn .nb .rule{height:1px;background:#2B2F36}
.cn .nb .row{min-height:39px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;gap:10px}
.cn .nb .msg{flex:1;min-width:0;font-size:13px;line-height:20px;color:#E6E8EB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .nb .msg .s{color:#9AA1AB}
.cn .nb .btns{display:flex;gap:6px;flex:none}
.cn .nb button{font:400 12px/16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#E6E8EB;background:transparent;border:1px solid #9AA1AB;border-radius:5px;padding:2px 8px;white-space:nowrap}
.cn .nb button.def{border-color:#E6E8EB;font-weight:600}
.cn .mk{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:8px;background:#E6E8EB;color:#15171B;font:600 10px/16px -apple-system,system-ui,sans-serif;flex:none}
</style>
</helmet>
<div class="cn" style="width: {{w}}px; height: {{h}}px">
<sc-if value="{{hasStrip}}" hint-placeholder-val="{{ true }}"><dc-import name="Strip" strip="{{strip}}" hint-size="100%,36px"></dc-import></sc-if>
<sc-if value="{{barTop}}">
<div class="nb">
<div class="row">
<span class="msg">{{bar.msg}}</span>
<sc-if value="{{bar.hasMk}}"><span class="mk">{{bar.mk}}</span></sc-if>
<div class="btns">
<sc-for list="{{bar.buttons}}" as="b" hint-placeholder-count="2"><button type="button" class="{{b.cls}}">{{b.label}}</button></sc-for>
</div>
</div>
</div>
</sc-if>
<div class="term">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
<sc-if value="{{l.isBar}}"><div class="bar" style="width: {{l.pct}}"></div></sc-if>
<sc-if value="{{l.isText}}"><div class="{{l.cls}}">{{l.t}}</div></sc-if>
</sc-for>
<div class="pr">&gt; <span style="display: inline-block; width: 7px; height: 14px; background: #E6E8EB; vertical-align: -2px"></span></div>
</div>
<sc-if value="{{hasBar}}" hint-placeholder-val="{{ true }}">
<div class="nb">
<div class="row">
<span class="msg">{{bar.msg}}<sc-if value="{{bar.hasSub}}"> <span class="s">{{bar.sub}}</span></sc-if></span>
<sc-if value="{{bar.hasMk}}"><span class="mk">{{bar.mk}}</span></sc-if>
<div class="btns">
<sc-for list="{{bar.buttons}}" as="b" hint-placeholder-count="2"><button type="button" class="{{b.cls}}">{{b.label}}</button></sc-for>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"con":{"editor":null},"$preview":{"width":720,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    const demo = {
      w: 720, h: 360,
      strip: { w: 720, tabs: [ { g: 'idle', title: 'Pricing research', on: true }, { g: 'work', title: 'Fix flaky cart test' }, { g: 'shell', title: 'checkout' } ] },
      lines: [ { bar: '70%' }, { bar: '52%' }, { t: '> /fork try the annual plan first' }, { t: '  ⎿  Workspace not trusted. Run `claude` in ~/claude-home/checkout once', dim: true }, { t: '     and accept the trust prompt, then retry.', dim: true } ],
      bar: { msg: 'Claude Code doesn’t trust checkout yet, so /fork couldn’t start.', buttons: [ { label: 'Not Now' }, { label: 'Trust This Folder…', def: true } ] }
    };
    const c = this.props.con || demo;
    const lines = (c.lines || []).map((l) => ({ isBar: !!l.bar, pct: l.bar || '0%', isText: !l.bar, t: l.t || '', cls: 'ln' + (l.dim ? ' dim' : '') }));
    const bar = c.bar ? { ...c.bar, hasSub: !!c.bar.sub, sub: c.bar.sub || '', hasMk: !!c.bar.mk, mk: c.bar.mk || '', buttons: (c.bar.buttons || []).map((b) => ({ label: b.label, cls: b.def ? 'def' : '' })) } : { msg: '', buttons: [] };
    return { w: c.w || 720, h: c.h || 360, hasStrip: !!c.strip, strip: c.strip ? { ...c.strip, w: c.w || 720 } : null, lines, hasBar: !!c.bar && !c.top, barTop: !!c.bar && !!c.top, bar };
  }
}
</script>
</body>
</html>

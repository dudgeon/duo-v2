<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console tab strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cs{height:36px;box-sizing:border-box;background:#15171B;border:1px solid #2B2F36;display:flex;align-items:center;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;line-height:19px;color:#9AA1AB;white-space:nowrap;overflow:hidden}
.cs .run{display:flex;gap:18px;align-items:center;flex:1;min-width:0;padding-left:16px;overflow:hidden}
.cs .t{display:inline-flex;align-items:center;gap:6px;flex:none;height:34px;position:relative}
.cs .on{color:#E6E8EB;font-weight:500}
.cs .mk{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:8px;background:#E6E8EB;color:#15171B;font:600 10px/16px -apple-system,system-ui,sans-serif;flex:none}
.cs .plus{flex:none;padding:0 16px 0 6px}
</style>
</helmet>
<div class="cs" style="width: {{w}}px">
<div class="run">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<span class="{{t.cls}}">
<sc-if value="{{t.idle}}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 5h7"></path></svg></sc-if>
<sc-if value="{{t.work}}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="5" r="3.75"></circle></svg></sc-if>
<sc-if value="{{t.review}}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.8L9.2 5 5 9.2 0.8 5z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{t.need}}"><svg width="10" height="10" viewBox="0 0 10 10" role="img" aria-label="needs you"><circle cx="5" cy="5" r="4.5" fill="#F97316"></circle></svg></sc-if>
<sc-if value="{{t.shell}}"><svg width="11" height="9" viewBox="0 0 12 10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 2L5 5 1.5 8M6.5 8.5h4"></path></svg></sc-if>
<sc-if value="{{t.forkMark}}"><svg width="10" height="10" viewBox="0 0 10 10" role="img" aria-label="fork" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="2.6" cy="2" r="1.2"></circle><circle cx="2.6" cy="8.2" r="1.2"></circle><circle cx="7.6" cy="2" r="1.2"></circle><path d="M2.6 3.2v3.8M7.6 3.2c0 2.2-5 1.6-5 3.8"></path></svg></sc-if>
<span>{{t.title}}</span>
<sc-if value="{{t.hasMk}}"><span class="mk">{{t.mk}}</span></sc-if>
</span>
</sc-for>
</div>
<span class="plus">+ ⌄</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"strip":{"editor":null},"$preview":{"width":620,"height":36}}'>
class Component extends DCLogic {
  renderVals() {
    const demo = { w: 620, tabs: [
      { g: 'idle', title: 'Pricing research' },
      { g: 'work', title: 'Pricing research (Branch)', on: true },
      { g: 'shell', title: 'alpha' }
    ] };
    const s = this.props.strip || demo;
    const tabs = (s.tabs || []).map((t) => ({
      ...t,
      cls: 't' + (t.on ? ' on' : ''),
      idle: t.g === 'idle', work: t.g === 'work', review: t.g === 'review', need: t.g === 'need', shell: t.g === 'shell',
      forkMark: !!t.fork, hasMk: !!t.mk, mk: t.mk || ''
    }));
    return { w: s.w || 620, tabs };
  }
}
</script>
</body>
</html>

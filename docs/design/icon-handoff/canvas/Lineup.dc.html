<div style="display: flex; align-items: baseline; gap: 12px">

<span style="font-size: 13px; line-height: 20px; color: #5b636d">128, 32 and 16 px, the 16 on light and dark. Every mark is a proposal [P].</span>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{icons}}" as="ic" hint-placeholder-count="12">
<div style="border: 1px solid #c9cdd3; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; height: 250px; box-sizing: border-box">
<div style="font-size: 13px; line-height: 20px; font-weight: 600">{{ic.label}}</div>
<div style="display: flex; align-items: flex-end; gap: 16px; flex: 1">
<svg width="128" height="128"><use href="{{ic.ref}}"></use></svg>
<div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
<svg width="32" height="32"><use href="{{ic.ref}}"></use></svg>
<div style="display: flex; gap: 6px">
<div style="width: 28px; height: 28px; border-radius: 6px; background: #f3f4f6; display: flex; align-items: center; justify-content: center"><svg width="16" height="16"><use href="{{ic.ref}}"></use></svg></div>
<div style="width: 28px; height: 28px; border-radius: 6px; background: #1e1f22; display: flex; align-items: center; justify-content: center"><svg width="16" height="16"><use href="{{ic.ref}}"></use></svg></div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2160,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const names = ['Two panes', 'One line, two panes', 'Monogram', 'Talk and page', 'Pair', 'Character', 'Folder with a prompt', 'Wordmark', 'Glass', 'Minimal line', 'Constellation', 'Two links'];
return { icons: names.map((n, i) => { const k = String(i + 1).padStart(2, '0'); return { label: k + '  ' + n, ref: '#L' + k }; }) };
}
}
</script>

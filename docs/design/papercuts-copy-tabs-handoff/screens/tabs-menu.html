<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Right pane, tab menu</title>
<meta name="design-size" content="460x360">
</head>
<body>
<!-- Exported from https://claude.ai/artifact/5DMeZMh58Lp7TdSif6VFza (board TabsMenu.dc.html, “Right pane · tab menu”); no holes or loops -->
<helmet>
<style>
body{margin:0}
a{color:#1f2328}a:hover{color:#5b636d}
</style>
</helmet>
<div style="width: 460px; height: 360px; box-sizing: border-box; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1f2328; font-size: 13px; line-height: 20px; border-left: 1px solid #c9cdd3; position: relative">
  <div style="height: 36px; display: flex; align-items: center; gap: 24px; padding: 0 16px; border-bottom: 1px solid #c9cdd3">
    <span>Project</span>
    <span>brief.md</span>
    <span style="font-weight: 600; background: #d8dce1; border-radius: 5px; padding: 2px 7px; margin: 0 -7px">release-notes.md</span>
    <span>notes.md</span>
    <span style="color: #5b636d">+</span>
  </div>
  <div style="padding: 16px 24px; display: flex; flex-direction: column; gap: 12px"><div style="font-size: 14px; font-weight: 600">Shipping the beta</div><div>Run this once on the work Mac before the walk-through.</div></div>
  <div role="menu" aria-label="Tab menu" style="position: absolute; left: 168px; top: 34px; width: 200px; box-sizing: border-box; padding: 5px; background: #ffffff; border: 1px solid #c9cdd3; border-radius: 10px; box-shadow: 0px 12px 32px rgba(31, 35, 40, 0.22); display: flex; flex-direction: column">
    <div role="menuitem" style="padding: 2px 10px; border-radius: 5px">Close Tab</div>
    <div role="menuitem" style="padding: 2px 10px; border-radius: 5px">Close Other Tabs</div>
    <div style="height: 1px; background: #c9cdd3; margin: 5px 10px"></div>
    <div role="menuitem" style="padding: 2px 10px; border-radius: 5px; background: #e9ecef">Move Tab Left</div>
    <div role="menuitem" style="padding: 2px 10px; border-radius: 5px">Move Tab Right</div>
    <div style="height: 1px; background: #c9cdd3; margin: 5px 10px"></div>
    <div role="menuitem" style="padding: 2px 10px; border-radius: 5px">Reveal in Files</div>
    <div role="menuitem" style="padding: 2px 10px; border-radius: 5px">Copy Path</div>
  </div>
</div>
</body>
</html>

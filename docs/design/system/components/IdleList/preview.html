<!doctype html>
<html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--pane);color:var(--text);font:13px/20px var(--font-ui);}
.t2{color:var(--text2)}.b{font-weight:600}.row{display:flex;align-items:center;gap:8px;height:26px}.row svg{flex:none}.w{margin-left:auto;color:var(--text2)}
.lbl{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}.need{color:var(--needsYou)}
.btn{font:12px/16px var(--font-ui);padding:4px 10px;border:1px solid var(--controlEdge);border-radius:6px;background:var(--pane);color:var(--text);display:inline-block}
.pill{font-size:11px;line-height:16px;padding:0 7px;border:1px solid var(--controlEdge);border-radius:9px;background:var(--pane);white-space:nowrap}
.card{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border:1px solid var(--rule);border-radius:6px}
.stack{display:flex;flex-direction:column;gap:10px}.hstack{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.cap{font-size:11px;color:var(--text2);margin-top:4px}
.console{background:var(--console);color:var(--consoleText);padding:16px}.mono{font:12px/19px var(--font-mono)}</style></head>
<body>
<div style="max-width:460px;border:1px solid var(--rule);border-radius:10px;padding:12px 8px;box-shadow:var(--shadowPopover)"><div class="lbl" style="padding:0 8px 6px">Idle · 21</div><div class="row" style="padding:0 8px;border-radius:6px;background:var(--selected)"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round"/></svg><span>Reading note 1</span><span class="t2" style="margin-left:auto;width:150px;overflow:hidden">reading</span><span class="t2" style="width:30px;text-align:right">2d</span></div><div class="row" style="padding:0 8px;border-radius:6px"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round"/></svg><span>Interview synthesis notes</span><span class="t2" style="margin-left:auto;width:150px;overflow:hidden">checkout</span><span class="t2" style="width:30px;text-align:right">3d</span></div><div class="row" style="padding:0 8px;border-radius:6px"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round"/></svg><span>Untitled scratch</span><span class="t2" style="margin-left:auto;width:150px;overflow:hidden">refunds</span><span class="t2" style="width:30px;text-align:right">1d</span></div></div>
</body></html>

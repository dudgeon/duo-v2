<!doctype html>
<html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--pane);color:var(--text);font:13px/20px var(--font-ui);}
.sheet{width:520px;padding:20px;background:var(--ground);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 32px rgba(31,35,40,.22);display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}.l{color:var(--text2);text-align:right;padding-top:2px}
.f{display:flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--rule);border-radius:6px;background:var(--pane)}
.pop{width:fit-content;gap:6px}.h{color:var(--text2);font-size:12px}.mono{font:12px/20px var(--font-mono);color:var(--text2)}
.btns{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}.btn{font:12px/16px var(--font-ui);padding:4px 10px;border:1px solid var(--controlEdge);border-radius:6px;background:var(--pane)}.def{border-color:var(--text);font-weight:600}</style></head>
<body><div class="sheet"><div style="font-weight:600">New project</div>
<div class="row"><span class="l">Name</span><span class="f">billing-emails</span></div>
<div class="row"><span class="l">Goal</span><div><span class="f">Ship the new billing emails by Nov 1</span><span class="h">One line. It shows on the project’s tile.</span></div></div>
<div class="row" style="align-items:center"><span class="l">In</span><span class="f pop"><svg width="12" height="10" viewBox="0 0 12 10"><path d="M1 2.2c0-.7.5-1.2 1.2-1.2h2.6l1 1.2h4c.7 0 1.2.5 1.2 1.2v4.4c0 .7-.5 1.2-1.2 1.2H2.2C1.5 9 1 8.5 1 7.8z" fill="none" stroke="var(--text2)" stroke-width="1.1"/></svg>payments /<svg width="10" height="8" viewBox="0 0 10 8"><path d="M1.5 2 5 6 8.5 2" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
<div class="row"><span></span><span class="mono">~/claude-home/payments/billing-emails</span></div>
<div class="row"><span></span><label><input type="checkbox" checked> Start a Claude session in it</label></div>
<div class="btns"><span class="btn">Cancel</span><span class="btn def">Create Project</span></div></div></body></html>

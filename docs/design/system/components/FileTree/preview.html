<!doctype html>
<html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--pane);color:var(--text);font:13px/20px var(--font-ui);}
.t2{color:var(--text2)}.b{font-weight:600}.row{display:flex;align-items:center;gap:8px;height:26px}.row svg{flex:none}.w{margin-left:auto;color:var(--text2)}
.lbl{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}.need{color:var(--needsYou)}
.btn{font:12px/16px var(--font-ui);padding:4px 10px;border:1px solid var(--controlEdge);border-radius:6px;background:var(--pane);color:var(--text);display:inline-block}
.pill{font-size:11px;line-height:16px;padding:0 7px;border:1px solid var(--controlEdge);border-radius:9px;background:var(--pane);white-space:nowrap}
.card{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border:1px solid var(--rule);border-radius:6px}
.stack{display:flex;flex-direction:column;gap:10px}.hstack{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.cap{font-size:11px;color:var(--text2);margin-top:4px}
.console{background:var(--console);color:var(--consoleText);padding:16px}.mono{font:12px/19px var(--font-mono)}</style></head>
<body>
<div style="max-width:300px;border-top:2px solid var(--controlEdge);padding-top:10px"><div class="lbl">Files</div><div class="t2" style="font:11px/20px var(--font-mono)">~/work/payments/checkout</div><div class="mono" style="line-height:24px">PROJECT.md<br><span style="display:inline-flex;gap:6px;align-items:center"><svg width="10" height="8" viewBox="0 0 10 8" aria-hidden="true"><path d="M1.5 2 5 6 8.5 2" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>docs/</span><br><span style="display:flex;background:var(--selected);border-radius:6px;padding:0 6px 0 22px">prd-v2.md<span class="t2" style="margin-left:auto;font:12px/24px var(--font-ui)">edited by Claude</span></span></div></div>
</body></html>

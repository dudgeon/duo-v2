<!-- @dsCard group="Lists" height=200 -->
<!doctype html>
<html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--pane);color:var(--text);font:13px/20px var(--font-ui);}
.t2{color:var(--text2)}.b{font-weight:600}.row{display:flex;align-items:center;gap:8px;height:26px}.row svg{flex:none}.w{margin-left:auto;color:var(--text2)}
.lbl{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}.need{color:var(--needsYou)}
.btn{font:12px/16px var(--font-ui);padding:4px 10px;border:1px solid var(--controlEdge);border-radius:6px;background:var(--pane);color:var(--text);display:inline-block}
.pill{font-size:11px;line-height:16px;padding:0 7px;border:1px solid var(--controlEdge);border-radius:9px;background:var(--pane);white-space:nowrap}
.card{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border:1px solid var(--rule);border-radius:6px}
.stack{display:flex;flex-direction:column;gap:10px}.hstack{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.cap{font-size:11px;color:var(--text2);margin-top:4px}
.console{background:var(--console);color:var(--consoleText);padding:16px}.mono{font:12px/19px var(--font-mono)}</style></head>
<body>
<div style="max-width:320px"><div class="row"><svg width="10" height="8" viewBox="0 0 10 8" aria-hidden="true"><path d="M1.5 2 5 6 8.5 2" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="var(--needsYou)"/></svg><span class="b">Launch copy</span><span class="pill">task · 2</span><span class="t2">review</span><span class="w">3m</span></div><div class="row" style="padding-left:22px"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="var(--needsYou)"/></svg><span>Draft headline</span><span class="w">3m</span></div><div class="row" style="background:var(--activeTint);border-radius:6px;padding:0 4px"><span style="width:10px"></span><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round"/></svg><span>“Summarise the six buyer…”</span><span class="w">at prompt</span></div><div class="row" style="background:var(--selected);border-radius:6px;padding:0 4px"><span style="width:10px"></span><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.2" fill="none" stroke="var(--text)" stroke-width="1.5"/></svg><span>Teardown research</span><span class="pill" style="border-color:var(--rule);background:none">thread · 2</span><span class="w">6m</span></div><div class="row"><span style="width:10px"></span><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round"/></svg><span>Fix footer links</span><span class="w">1h</span></div></div>
</body></html>

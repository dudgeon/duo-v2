<!doctype html>
<html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:var(--pane);color:var(--text);font:13px/20px var(--font-ui);}
.btn{font:12px/16px var(--font-ui);padding:4px 10px;border:1px solid var(--controlEdge);border-radius:6px;background:var(--pane);color:var(--text);display:inline-block}
.mono{font:11px/16px var(--font-mono)}.ph{font:12px/19px var(--font-mono);padding:0 4px;border:1px solid var(--rule);border-radius:4px;background:var(--pane)}</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:2px;padding:10px 16px;background:var(--ground);border-bottom:1px solid var(--rule)">
<div style="display:flex;align-items:center;gap:6px"><span style="font-weight:600">Template for new tasks</span><span style="color:var(--text2)">· Home</span><span style="flex:1"></span><span class="btn">Insert ▾</span><span class="btn">Preview</span><span class="btn">Reset…</span></div>
<div style="font-size:12px;line-height:16px;color:var(--text2)">Used by + New task in every project without its own · <span class="mono">~/claude-home/templates/new-task.md</span></div>
</div>
<div style="padding:12px 20px;font:12px/19px var(--font-mono)"><span style="color:var(--text2)">title:</span> "<span class="ph">{{title}}</span>"</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--pane);color:var(--text);font:13px/20px var(--font-ui);}
.t2{color:var(--text2)}.b{font-weight:600}.row{display:flex;align-items:center;gap:8px;height:26px}.row svg{flex:none}.w{margin-left:auto;color:var(--text2)}
.lbl{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}.need{color:var(--needsYou)}
.btn{font:12px/16px var(--font-ui);padding:4px 10px;border:1px solid var(--controlEdge);border-radius:6px;background:var(--pane);color:var(--text);display:inline-block}
.pill{font-size:11px;line-height:16px;padding:0 7px;border:1px solid var(--controlEdge);border-radius:9px;background:var(--pane);white-space:nowrap}
.card{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border:1px solid var(--rule);border-radius:6px}
.stack{display:flex;flex-direction:column;gap:10px}.hstack{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.cap{font-size:11px;color:var(--text2);margin-top:4px}
.console{background:var(--console);color:var(--consoleText);padding:16px}.mono{font:12px/19px var(--font-mono)}body{padding:0}</style></head>
<body>
<div style="background:var(--ground);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;height:40px;padding:0 12px"><span style="text-decoration:underline;text-decoration-color:var(--controlEdge)" class="t2">All projects</span><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><path d="M2 1.5 6 5 2 8.5" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t2">payments</span><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><path d="M2 1.5 6 5 2 8.5" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="b">checkout</span><span style="margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;height:24px;padding:0 8px;border:1px solid var(--rule);border-radius:6px;background:var(--pane)"><span class="t2">⌕</span><span class="t2">Search all projects</span><span class="t2" style="margin-left:auto">⇧⌘A</span></span><span title="Hide Right Pane ⌥⌘0" aria-label="Hide Right Pane" style="display:flex;margin-left:4px;padding:4px 6px"><svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><rect x="1" y="1" width="16" height="12" rx="2.5" fill="none" stroke="var(--text2)" stroke-width="1.3"/><path d="M11.5 1v12" fill="none" stroke="var(--text2)" stroke-width="1.3"/></svg></span></div>
</body></html>

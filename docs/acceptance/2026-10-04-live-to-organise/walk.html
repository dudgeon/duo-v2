<html lang="en">
<head>
<meta charset="utf-8">

<title>Duo acceptance: live workspace to collisions</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e2e2e0;
  --chip: #efefec; --accent: #2f6fde; --ok: #1f8a4c; --ok-bg: #e5f4ea; --bad: #c4362c; --bad-bg: #fbe9e7;
  --later: #8a6a12; --later-bg: #f8f0d8; --code: #f1f1ee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1d; --card: #252528; --ink: #ececee; --muted: #9a9aa0; --line: #38383c;
    --chip: #303034; --accent: #6b9cf0; --ok: #5ccb8a; --ok-bg: #1d3427; --bad: #f0786d; --bad-bg: #3d2220;
    --later: #e2c264; --later-bg: #3a321b; --code: #2e2e32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1d; --card: #252528; --ink: #ececee; --muted: #9a9aa0; --line: #38383c;
  --chip: #303034; --accent: #6b9cf0; --ok: #5ccb8a; --ok-bg: #1d3427; --bad: #f0786d; --bad-bg: #3d2220;
  --later: #e2c264; --later-bg: #3a321b; --code: #2e2e32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
code { font: 12.5px "SF Mono", ui-monospace, Menlo, monospace; background: var(--code); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
h1 { font-size: 17px; margin: 0; flex: 1 1 260px; }
.progress { flex: 1 1 100%; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; display: flex; }
.progress span { display: block; height: 100%; }
.counts { color: var(--muted); font-size: 12.5px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 5px 11px; }
button:hover { border-color: var(--muted); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.primary:hover { border-color: var(--accent); filter: brightness(1.08); }
main { max-width: 860px; margin: 0 auto; padding: 8px 16px 80px; }
.intro { color: var(--muted); margin: 14px 0 4px; }
.setup { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0 6px; }
.setup ol { margin: 4px 0; padding-left: 20px; }
.store { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; }
.card.accepted { border-left-color: var(--ok); }
.card.rejected { border-left-color: var(--bad); }
.card.deferred { border-left-color: var(--later); }
.top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.top h3 { font-size: 15px; margin: 0; flex: 1 1 240px; }
.ref { font-size: 11.5px; color: var(--muted); }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; background: var(--chip); color: var(--muted); }
.pill.accepted { background: var(--ok-bg); color: var(--ok); }
.pill.rejected { background: var(--bad-bg); color: var(--bad); }
.pill.deferred { background: var(--later-bg); color: var(--later); }
.what { margin: 4px 0 8px; color: var(--muted); }
.label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-top: 6px; }
ol.steps { margin: 2px 0 6px; padding-left: 20px; }
.expect { margin: 2px 0 10px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.actions .accept[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.actions .reject[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.actions .defer[aria-pressed="true"] { background: var(--later); border-color: var(--later); color: #fff; }
.saved { font-size: 11.5px; color: var(--muted); margin-left: auto; }
textarea { width: 100%; min-height: 54px; margin-top: 8px; resize: vertical; font: inherit; color: inherit;
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; }
.hidden { display: none; }
/* Set up test, Claude's attempt, cleared items */
.setupbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 2px 0 8px; }
a.setupbtn { display: inline-block; text-decoration: none; color: #fff; background: var(--accent); border-radius: 7px; padding: 4px 11px; font-weight: 600; font-size: 13px; }
a.setupbtn:hover { filter: brightness(1.08); }
.setupbar .alt { font-size: 12px; color: var(--muted); }
.claude { border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; margin: 6px 0 10px; background: var(--bg); }
.claude .head { display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 600; }
.claude ul { margin: 2px 0 4px; padding-left: 18px; }
.claude .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-top: 4px; }
.pill.passed { background: var(--ok-bg); color: var(--ok); }
.pill.failed { background: var(--bad-bg); color: var(--bad); }
.pill.partial { background: var(--later-bg); color: var(--later); }
.cleared-note { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
/* Decisions */
#decisions h2 .count { font-weight: 400; text-transform: none; letter-spacing: 0; }
.decision { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
.decision.answered { border-left-color: var(--ok); }
.decision .context p { margin: 4px 0 6px; }
.decision .context ul { margin: 2px 0 6px; padding-left: 20px; }
.options { display: grid; gap: 8px; margin: 8px 0 4px; }
.option { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; background: var(--bg); }
.option:hover { border-color: var(--muted); }
.option.chosen { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; background: var(--ok-bg); }
.option input { margin-top: 3px; }
.option .olabel { font-weight: 600; }
.option .rec { font-size: 11px; font-weight: 600; color: var(--accent); margin-left: 6px; }
.option .odesc { grid-column: 2; color: var(--muted); }
.option .mock { grid-column: 2; margin-top: 6px; overflow-x: auto; }
.decision .chosen-note { font-size: 12.5px; color: var(--ok); margin-left: auto; }
/* Mini mockups: Duo's light look, whatever the page theme */
.mk { --t: #1f2328; --t2: #6e7781; --rule: #e1e4e8; --sel: #eef1f4; --pane: #fff; --ground: #f6f7f8; --edge: #d0d7de;
  font: 12px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--t); display: inline-block; min-width: 0; max-width: 100%; }
.mk code, .mk .mono { font: 11.5px "SF Mono", ui-monospace, Menlo, monospace; background: none; padding: 0; }
.mk-menu { background: rgba(246,246,246,.98); border: 1px solid #c8c8c8; border-radius: 7px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.18); width: 270px; }
.mk-menu .ttl { font-weight: 600; padding: 2px 8px 4px; color: #555; }
.mk-item { display: flex; justify-content: space-between; gap: 16px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.mk-item.hl { background: #2f6fde; color: #fff; }
.mk-item.hl .k { color: #fff; }
.mk-item.dim { color: #aaa; }
.mk-item .k { color: #777; }
.mk-sep { height: 1px; background: #ddd; margin: 4px 6px; }
.mk-modal { background: var(--pane); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 24px rgba(31,35,40,.16); width: 440px; max-width: 100%; overflow: hidden; }
.mk-field { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.mk-field .q { flex: 1; }
.mk-field .ph { flex: 1; color: var(--t2); }
.mk-scope { display: inline-flex; border: 1px solid var(--edge); border-radius: 5px; font-size: 11px; overflow: hidden; }
.mk-scope span { padding: 1px 6px; color: var(--t2); }
.mk-scope span.on { background: var(--sel); color: var(--t); font-weight: 600; }
.mk-filters { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 6px 10px 7px; border-bottom: 1px solid var(--rule); }
.mk-pop { border: 1px solid var(--edge); border-radius: 5px; padding: 1px 7px; background: #fff; }
.mk-pop.set { background: var(--sel); font-weight: 600; }
.mk-pop.focus { outline: 2px solid #2f6fde; outline-offset: 1px; }
.mk-chip { border-radius: 10px; padding: 1px 7px; background: var(--t); color: #fff; font-size: 11px; }
.mk-hint { margin-left: auto; color: var(--t2); font-size: 11px; }
.mk-row { padding: 5px 8px; margin: 2px 6px; border-radius: 6px; }
.mk-row.sel { background: var(--sel); }
.mk-row .t { font-weight: 600; }
.mk-row .m { color: var(--t2); font-size: 11px; }
.mk-pill { border: 1px solid var(--edge); border-radius: 8px; padding: 0 5px; font-size: 10px; color: var(--t2); margin-left: 4px; }
.mk-foot { display: flex; justify-content: space-between; gap: 10px; padding: 5px 10px; background: var(--ground); border-top: 1px solid var(--rule); font-size: 11px; }
.mk-foot .r { color: var(--t2); }
.mk-body { padding: 6px 0; }
.mk-sec { padding: 4px 12px 2px; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--t2); }
.mk-help { padding: 2px 12px; color: var(--t2); }
.mk-caption { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.mk-side { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
dialog { max-width: min(720px, calc(100vw - 32px)); width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); padding: 16px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog textarea { min-height: 320px; font: 12.5px "SF Mono", ui-monospace, Menlo, monospace; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.row .note { margin-right: auto; color: var(--muted); font-size: 12.5px; }
</style>
</head>

<header>
  <div class="bar">

  <textarea id="out" readonly></textarea>

</dialog>

on tab; ⇧⌘W closes the window.", "steps": ["Click into a document, press ⌘W.", "Click into a session terminal, press ⌘W."], "expect": "The document tab closes; then the session tab closes (the session stays listed and resumable). The window stays.", "ref": "F-44", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open docs/prd.md"]}, {"id": "fv-new", "group": "File verbs", "title": "New file, folder, from template", "what": "From File (⌘N, ⇧⌘N), the + or a right-click in Files.", "steps": ["Right-click Files' background: New Markdown File, New Folder, New from Template ▸ meeting-notes."], "expect": "Each appears in Files with its name selected for typing; Return keeps it, Esc cancels the rename. Templates list the project's templates/ then Home's.", "ref": "DL-61, DL-62", "setup": ["fixture reset-checkout", "open checkout"]}, {"id": "fv-edit", "group": "File verbs", "title": "Rename, duplicate, move, trash", "what": "Right-click a file or folder in Files, or a document tab.", "steps": ["Rename a file you made; Duplicate it; Move To… a folder; Move to Trash."], "expect": "Each works; an open tab follows a rename or move; Trash closes it and the file is in the macOS Trash.", "ref": "DL-61", "setup": ["fixture reset-checkout", "open checkout"]}, {"id": "fv-copy", "group": "File verbs", "title": "Copy path, relative path, link", "what": "Three copy formats.", "steps": ["Right-click `docs/prd.md`: Copy Path, paste; Copy Relative Path, paste; Copy as Link, paste."], "expect": "/Users/…/`docs/prd.md`; `docs/prd.md`; [prd](`docs/prd.md`).", "ref": "DL-61", "setup": ["open checkout"]}, {"id": "fv-open", "group": "File verbs", "title": "Reveal in Finder, Open With", "what": "Hand a file to Finder or another app.", "steps": ["Right-click a file: Reveal in Finder; Open With ▸ another app."], "expect": "Finder selects it; the app opens it.", "ref": "DL-61", "setup": ["open checkout"]}, {"id": "fv-send", "group": "File verbs", "title": "Send a ft and land with motion).", "steps": ["Drag the scratch tile onto refunds: watch the card, the scratch tile sinking and refunds rising as you hover.", "Release: read the sheet on the window, click Merge; refunds pulses with `2 sessions moved in`.", "Edit › Undo."], "expect": "The sheet lists both sessions and says scratch's folder and files stay; after Merge, scratch leaves the map and refunds says what moved in; Undo restores. (Motion is a first pass on your brief; say what to change.)", "ref": "DL-65, DL-66", "setup": ["go all"]}, {"id": "org-relocate", "group": "Organising", "title": "A moved session relocates when resumed", "what": "After a move, the next resume runs /cd so Claude moves the transcript to the new project's folder.", "steps": ["Move Draft a post about pricing (scratch) to checkout.", "Open checkout and click the session."], "expect": "Claude opens the old conversation, then shows Moved to …/payments/checkout.", "ref": "DL-64, F-45", "setup": ["open scratch"]}, {"id": "ret-archive", "group": "Retention", "title": "Sessions survive Claude's 30-day cleanup", "what": "Duo keeps a copy of every listed session (and its tool outputs) and puts it back on resume.", "steps": ["With Duo open for a minute, quit it.", "In the repo: `python3 scripts/acceptance/fixtures.py --purge` (simulates the cleanup).", "Open Duo again (open-duo.sh), open refunds, click Refund edge cases (purge test)."], "expect": "It's still listed by title and resumes with its conversation.", "ref": "DL-44, DL-47, DL-48", "setup": ["fixture purge", "open refunds"]}, {"id": "ret-carry", "group": "Retention", "title": "Carry on in a new session", "what": "Starts a new session that picks up from an archived one.", "steps": ["In a Duo terminal: `duo2 session carry-on <id of the purge-test session>` (the id is in `~/DuoAcceptance/.planted.json`)."], "expect": "A new session starts in refunds, reads the archived transcript and summarises where it left off.", "ref": "Q-19", "setup": ["open refunds"]}, {"id": "ret-size", "group": "Retention", "title": "Archive size in `duo2 doctor`", "what": "No limit, but its size is shown.", "steps": ["`duo2 doctor`"], "expect": "A line like Session archive: N sessions, X KB.", "ref": "DL-56"}, {"id": "cli-basics", "group": "duo2 command line", "title": "duo2 talks to Duo", "what": "ping, status, projects, needs-you, open, help.", "steps": ["duo2 help, then duo2 status, duo2 projects, duo2 open refunds."], "expect": "Answers match the app; open switches Duo to refunds.", "ref": "F-29"}, {"id": "cli-search", "group": "duo2 command line", "title": "Search across every project", "what": "By meaning and by words, files and sessions, with the app closed too.", "steps": ["`duo2 search customers charged twice`", "`duo2 search ERR_REFUND_409`", "`duo2 search --kind session interview`", "Quit Duo and run a search again."], "expect": "notes/duplicate-billing.md first; errors.md for the exact code; the interview session; results still come back with Duo closed.", "ref": "F-36, F-38"}, {"id": "cli-legacy", "group": "duo2 command line", "title": "Legacy Duo detection and removal", "what": "Finds legacy Duo's instructions, disables them with a backup, restores them. The fixture is a fake config, not your real ~/.claude.", "steps": ["`CLAUDE_CONFIG_DIR=~/DuoAcceptance/legacy-claude-config duo2 legacy`", "`… duo2 legacy disable --yes`", "`… duo2 legacy restore <the backup path it printed>`"], "expect": "Lists 4 items; disable removes them (your own hook and text stay); restore puts everything back.", "ref": "F-37"}, {"id": "app-gitignore", "group": "App", "title": "Keep .duo out of git", "what": "In a git repo, Duo offers once to add .duo/ to `.gitignore`.", "steps": ["After opening Duo on the fixtures, look for the alert about onboarding."], "expect": "Add to `.gitignore` writes .duo/ to onboarding/`.gitignore`; Don't Add writes nothing; either answer is remembered.", "ref": "DL-50"}, {"id": "app-menus", "group": "App", "title": "Menus", "what": "File (New Markdown File, New Folder, Save, Close Tab, Close Window), Edit (text items, Find, Spelling), Format, View, Go.", "steps": ["Open each menu; try Go › All Projects and Go › Home."], "expect": "Items are present and work; disabled ones are greyed when they don't apply.", "ref": "F-43", "setup": ["go all"]}, {"id": "app-clear", "group": "App", "title": "`/clear` keeps the tab with the session", "what": "After `/clear` in a terminal, the tab follows the new conversation.", "steps": ["In a session, type `/clear`, then a short prompt."], "expect": "The tab is renamed after the new conversation; the old session is still listed.", "ref": "F-29", "setup": ["open checkout", "session-running checkout"]}, {"id": "send-doc-selection", "group": "Send to Claude", "title": "Send selected text from a document", "what": "Selected Markdown goes to the prompt quoted, with its file and lines.", "steps": ["Open `docs/prd.md`, select the Goals list.", "Right-click › Send Selection to Claude. Then try Edit › Send Selection to Claude."], "expect": "The prompt shows a pasted block (`[Pasted text +N lines]`) starting `From docs/prd.md, lines …:` with the text quoted. Nothing is sent. (No shortcut yet: Q-22.)", "ref": "DL-67, DL-68", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open docs/prd.md"]}, {"id": "send-session-project", "group": "Send to Claude", "title": "Send a session or a project", "what": "Right-click a session row or a project tile.", "steps": ["In checkout, right-click a session row › Send to Claude.", "Go to All projects, right-click the refunds tile › Send to Claude (Home's session receives it)."], "expect": "A short block naming the session (id, how to read it) or the project (folder, PROJECT.md, goal, health, next). Duo switches to the receiving session with the cursor in its prompt.", "ref": "DL-67", "setup": ["open checkout", "session-running checkout"]}, {"id": "send-why-not", "group": "Send to Claude", "title": "Says why it can't send", "what": "Send to Claude names the reason when the visible tab can't take context.", "steps": ["Click `+ New session` and at once, before Claude's prompt appears, right-click a file.", "Close every session in the project (⌘W on each) and right-click a file."], "expect": "The item reads like `Send to Claude: Claude isn't ready yet` or `…: No session is showing`, greyed out; Send To ▸ still lists other sessions and New Session.", "ref": "DL-69, F-46", "setup": ["open checkout"]}, {"id": "html-view", "group": "HTML pages", "title": "HTML files open as live pages", "what": "Read-only, reloaded when the page or its css/js/images change; links to sites open in your browser.", "steps": ["In checkout, open `prototypes/checkout.html`.", "Edit `prototypes/checkout.css` in another editor: change `.primary { background: #2f6fde` to `orange`, save.", "Click `Shipping policy`."], "expect": "The page shows with its styles and card image; within a second of saving the button turns orange; the link opens in your browser, not in Duo. (The tab has no chrome yet: Q-21.)", "ref": "DL-67, F-46", "setup": ["fixture reset-checkout", "open checkout", "doc open prototypes/checkout.html"]}, {"id": "html-selection", "group": "HTML pages", "title": "Send text and images from a page", "what": "Select across text and the card image, or right-click just the image.", "steps": ["Select from the card image through `Pay as a guest…`, right-click › Send Selection to Claude.", "Right-click only the card image › Send Image to Claude."], "expect": "The prompt gets the quoted text and `image: …/prototypes/card.svg (alt \"A payment card\")`.", "ref": "DL-67", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open prototypes/checkout.html"]}, {"id": "html-picker", "group": "HTML pages", "title": "Select an element and ask Claude to change it", "what": "The workflow you asked for: Select Element › click a button › Send › “make this button yellow”.", "steps": ["With a checkout session showing, right-click the page › Select Element.", "Move over the page (outlines follow), click `Pay now`.", "In the bar under the page, Send to Claude.", "Type `make this button yellow` and press Return."], "expect": "The prompt shows `[Image #1]` (the element's screenshot) and a pasted block with `<button#pay.cta.primary>`, selector `#pay`, `under: Checkout › Payment`, styles and HTML. Claude edits `checkout.css` and the page turns yellow by itself. (Plain look for now: Q-21.)", "ref": "DL-67, DL-70, LR-44", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open prototypes/checkout.html"]}, {"id": "html-picker-keys", "group": "HTML pages", "title": "Picker: Pick Another, Esc, Send To", "what": "Leaving and redirecting the picker.", "steps": ["Select Element, click a heading, then Pick Another and click the input.", "Send To ▸ New Session.", "Select Element again, press Esc."], "expect": "Pick Another unfreezes; New Session starts one and pastes there once ready; Esc removes the outline and the bar.", "ref": "DL-70", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open prototypes/checkout.html"]}, {"id": "cli-help", "group": "duo2 command line", "title": "duo2 covers everything (help and reference)", "what": "One registry; help and the reference are generated (DL-71, DL-72).", "steps": ["`duo2 help`, then `duo2 help files`.", "Open `docs/cli/duo2.md` and `docs/features/duo2.md` in the repo."], "expect": "Everyday verbs, then 10 families; the reference lists every verb with where you'd do it in the app, and the few UI-only items with reasons.", "ref": "DL-71–DL-73, F-47"}, {"id": "cli-agent-drives", "group": "duo2 command line", "title": "Claude drives Duo", "what": "Ask a session to do things you'd do by hand.", "steps": ["In a checkout session: `Using duo2, open docs/research.md in Duo, then rename it to interview-research.md.`", "Then: `What do I have selected in Duo?` after selecting a sentence in a document."], "expect": "Duo shows research.md, then the file and its tab are renamed. Claude answers the second with your selection (it runs `duo2 selection`).", "ref": "DL-71", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout"]}, {"id": "cli-doc-edit", "group": "duo2 command line", "title": "Claude edits an open document through Duo", "what": "`duo2 doc insert` / `doc replace` change the editor's buffer, highlighted as added by Claude.", "steps": ["Open `docs/prd.md`. In a checkout session: `Use duo2 doc replace to change \"Checkout PRD\" to \"Checkout PRD (v2)\".`"], "expect": "The title changes in front of you, highlighted until you type; the file autosaves.", "ref": "LR-34, F-47", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open docs/prd.md"]}, {"id": "cli-confirm", "group": "duo2 command line", "title": "Moves from the CLI still ask you", "what": "`session move` and `project merge` show Duo's sheet; the command waits.", "steps": ["In a Home session: `Use duo2 to move the scratch session \"Draft a post about pricing\" to checkout.`", "Click Cancel on the sheet; ask again and click Move; then `duo2 undo`."], "expect": "Cancel: Claude reports it wasn't moved. Move: it's filed in checkout. Undo puts it back.", "ref": "DL-66, DL-71", "setup": ["go all"]}, {"id": "install-consent", "group": "Install", "title": "One question before writing into ~/.claude", "what": "Duo asks once, listing every change (DL-75).", "steps": ["Launch Duo with `open-duo.sh`: an alert lists 4 changes. Choose Install (or Not Now, then later `duo2 install`).", "`duo2 doctor`; look at the end of `~/.claude/CLAUDE.md`, `~/.claude/skills/duo2/SKILL.md`, and `ls -l ~/.local/bin/duo2`."], "expect": "Install: a short `<!-- duo2:begin … -->` block after your own text, the skill, and the link into Duo.app; doctor says each is current. Not Now: nothing written, not asked again until December`."], "expect": "The new goal appears in the editor highlighted, without a permission prompt; Claude says it's done; the file on disk has it a second later. ⌘Z undoes it.", "ref": "DL-78, F-49", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open docs/prd.md"]}, {"id": "agent-edit-while-typing", "group": "Claude edits open documents", "title": "Claude edits while you type", "what": "Your unsaved typing and Claude's change merge.", "steps": ["Ask Claude for an edit near the end of the PRD, and while it works, keep typing in the Problem section."], "expect": "Both your typing and Claude's change are there; nothing you typed disappears.", "ref": "DL-77, DL-78", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open docs/prd.md"]}, {"id": "agent-edit-doctor", "group": "Claude edits open documents", "title": "Hooks status, and the backup without them", "what": "Hooks can be turned off by a managed setting; Duo says so, and the primer and merge still hold.", "steps": ["In a Duo session's terminal: `duo2 doctor`.", "Optional, on the work Mac: if hooks are off there, repeat the Apple Pay request."], "expect": "`Hooks: running in this session…` here. Without hooks, Claude should use `duo2 doc edit` (Opus did in testing; Haiku didn't), and a direct write still shows up highlighted and never over your unsaved text.", "ref": "DL-78, F-49", "setup": ["open checkout", "session-running checkout"]}, {"id": "col-merge", "group": "Collisions with disk", "title": "Typing while something else writes the file", "what": "Changes to different lines merge (DL-77).", "steps": ["Open `docs/prd.md`. In Terminal run `sleep 5; sed -i '' 's/Decide on saved cards/Decide on saved cards (Oct 10)/' ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md`", "Switch to Duo straight away and keep typing in the `## Goals` heading for a few seconds."], "expect": "Your heading change stays; the outside change appears highlighted; the file on disk ends up with both.", "ref": "DL-77, F-50", "setup": ["fixture reset-checkout", "open checkout", "doc open docs/prd.md"]}, {"id": "col-conflict", "group": "Collisions with disk", "title": "Both edit the same line", "what": "A real overlap keeps your text and asks.", "steps": ["In Terminal run `sleep 5; sed -i '' 's/## Open questions/## Open questions (theirs)/' ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md`, then switch to Duo and keep typing at the end of the `## Open questions` heading.", "Read the bar under the document; choose Use Theirs. Repeat the race and choose Keep Mine.", "`duo2 doc history ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md`"], "expect": "A bar: `Changed on disk where you're editing (line …). Both versions are kept.` with Use Theirs / Keep Mine; autosave waits for your choice. History lists the version as opened and both sides. (Plain look: Q-20.)", "ref": "DL-77, F-50", "setup": ["fixture reset-checkout", "open checkout", "doc open docs/prd.md"]}, {"id": "col-switch", "group": "Collisions with disk", "title": "Nothing lost when you look away", "what": "Unsaved text survives switching documents, even mid-conflict.", "steps": ["Make a conflict as above, then open `docs/research.md` and come back to `prd.md`."], "expect": "Your text and the bar are still there.", "ref": "DL-77", "setup": ["fixture reset-checkout", "open checkout", "doc open docs/prd.md"]}, {"id": "col-removed", "group": "Collisions with disk", "title": "File removed on disk", "what": "The text stays, with a way to put it back.", "steps": ["With `prd.md` open: `mv ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md /tmp/prd-moved.md` in Terminal.", "Click Save to Recreate. Then move /tmp/prd-moved.md back if you like."], "expect": "`Removed on disk. Your text is still here.` and Save to Recreate writes it back; nothing autosaves it back on its own.", "ref": "DL-77", "setup": ["fixture reset-checkout", "open checkout", "doc open docs/prd.md"]}, {"id": "col-quit", "group": "Collisions with disk", "title": "Quitting right after typing", "what": "The last second's typing is saved on quit.", "steps": ["Type a word in a document and press ⌘Q immediately.", "Open the file in another editor."], "expect": "The word is in the file.", "ref": "DL-77", "setup": ["fixture reset-checkout", "open checkout", "doc open docs/prd.md"]}, {"id": "send-cmd-d", "group": "Send to Claude", "title": "⌘D sends the selection", "what": "Your Q-22 answer: ⌘D is Send Selection to Claude (DL-79).", "steps": ["Select the Goals list in `docs/prd.md` and press ⌘D.", "Check Edit › Send Selection to Claude shows ⌘D, and the right-click item too."], "expect": "The selection lands in the checkout session's prompt, not sent. ⌘D no longer selects the next occurrence in the editor.", "ref": "DL-79", "setup": ["fixture reset-checkout", "open checkout", "session-running checkout", "doc open docs/prd.md"]}, {"id": "search-field", "group": "App", "title": "The toolbar field says Search, ⌘K is free", "what": "DL-80: Jump merged into Search; the field reads Search all projects ⇧⌘A (the modal itself isn't built yet).", "steps": ["Look at the toolbar field; press ⌘K."], "expect": "`Search all projects ⇧⌘A`; ⌘K does nothing; Go menu has no Jump item.", "ref": "DL-80", "setup": ["go all"]}], "decisions": [{"id": "q22-send-chord", "ref": "Q-22 · DL-34, DL-67", "title": "A keyboard shortcut for Send Selection to Claude", "context": ["**Send Selection to Claude** puts the text you've selected (in a Markdown document or an HTML page) into the showing Claude session's prompt, quoted with its file and lines, without sending. Today it's in **Edit › Send Selection to Claude** and on the right-click menu, with no shortcut.", "The shortcut map is locked (DL-34): every chord needs a decision. All Duo chords carry ⌘ so they never collide with keys typed into Claude Code. Chords already taken:", ["`⌘K` jump · `⇧⌘A` search · `⌘↑` All projects · `⇧⌘H` Home · `⇧⌘P` peek · `⌘↩` jump into the peek's selection", "`⌃⌘S` sidebar · `⌥⌘0` right pane · `⌥⌘←/→` panes · `⌘N` / `⇧⌘N` new file / folder · `⌘S` save · `⌘B` / `⌘I` bold / italic · `⌘W` / `⇧⌘W` close tab / window", "plus macOS's own: `⌘F` find, `⌘Z` undo, `⌘C/V/X`, `⌘A`, `⌘Q`…"], "Legacy Duo used **⌘D** for exactly this (its \"Send → agent\" pill), so your fingers may already know it. ⌘D is free in Duo. In the macOS Save dialog ⌘D means \"Don't Save\", which can't clash with a document view.", "This choice can also be Search's \"Send to Claude\" shortcut (decision 23e), so one chord means send everywhere."], "options": [{"id": "cmd-d", "label": "⌘D", "recommended": true, "desc": "Legacy's chord, free in Duo, one hand.", "mockup": "<div class=\"mk-side\"><div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Edit<\/div><div class=\"mk-item \"><span>Cut<\/span><span class=\"k\">⌘X<\/span><\/div><div class=\"mk-item \"><span>Copy<\/span><span class=\"k\">⌘C<\/span><\/div><div class=\"mk-item \"><span>Paste<\/span><span class=\"k\">⌘V<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item hl\"><span>Send Selection to Claude<\/span><span class=\"k\">⌘D<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Find…<\/span><span class=\"k\">⌘F<\/span><\/div><\/div><\/div><div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Right-click on selected text<\/div><div class=\"mk-item hl\"><span>Send Selection to Claude<\/span><span class=\"k\">⌘D<\/span><\/div><div class=\"mk-item \"><span>Send Selection To<\/span><span class=\"k\">▸<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Copy<\/span><span class=\"k\">⌘C<\/span><\/div><div class=\"mk-item \"><span>Look Up “saved cards”<\/span><span class=\"k\"><\/span><\/div><\/div><\/div><\/div><div class=\"mk-caption\">Edit menu and right-click, with the chord shown.<\/div>"}, {"id": "shift-cmd-d", "label": "⇧⌘D", "desc": "Leaves ⌘D for something else later; two modifiers.", "mockup": "<div class=\"mk-side\"><div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Edit<\/div><div class=\"mk-item \"><span>Cut<\/span><span class=\"k\">⌘X<\/span><\/div><div class=\"mk-item \"><span>Copy<\/span><span class=\"k\">⌘C<\/span><\/div><div class=\"mk-item \"><span>Paste<\/span><span class=\"k\">⌘V<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item hl\"><span>Send Selection to Claude<\/span><span class=\"k\">⇧⌘D<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Find…<\/span><span class=\"k\">⌘F<\/span><\/div><\/div><\/div><div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Right-click on selected text<\/div><div class=\"mk-item hl\"><span>Send Selection to Claude<\/span><span class=\"k\">⇧⌘D<\/span><\/div><div class=\"mk-item \"><span>Send Selection To<\/span><span class=\"k\">▸<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Copy<\/span><span class=\"k\">⌘C<\/span><\/div><div class=\"mk-item \"><span>Look Up “saved cards”<\/span><span class=\"k\"><\/span><\/div><\/div><\/div><\/div><div class=\"mk-caption\">Same places, two-modifier chord.<\/div>"}, {"id": "none", "label": "No shortcut", "desc": "Menu and right-click only, as now.", "mockup": "<div class=\"mk-side\"><div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Edit<\/div><div class=\"mk-item \"><span>Cut<\/span><span class=\"k\">⌘X<\/span><\/div><div class=\"mk-item \"><span>Copy<\/span><span class=\"k\">⌘C<\/span><\/div><div class=\"mk-item \"><span>Paste<\/span><span class=\"k\">⌘V<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item hl\"><span>Send Selection to Claude<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Find…<\/span><span class=\"k\">⌘F<\/span><\/div><\/div><\/div><div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Right-click on selected text<\/div><div class=\"mk-item hl\"><span>Send Selection to Claude<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Send Selection To<\/span><span class=\"k\">▸<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Copy<\/span><span class=\"k\">⌘C<\/span><\/div><div class=\"mk-item \"><span>Look Up “saved cards”<\/span><span class=\"k\"><\/span><\/div><\/div><\/div><\/div><div class=\"mk-caption\">No chord; the menu item is the way in.<\/div>"}]}, {"id": "q23a-narrow", "ref": "Q-23 · search-handoff §5, §6", "title": "Search: ⇧⌘A again narrows to this project", "context": ["Inside a project, Search covers **all projects**, with this project's results boosted (DL-76). The design proposes pressing **⇧⌘A again** to narrow to this project only, and once more to widen back. The scope pop-up shows it and a hint names the key. (The scope pop-up works either way.)"], "options": [{"id": "yes", "label": "Yes, ⇧⌘A toggles all ↔ this project", "recommended": true, "desc": "No new chord: the same key, pressed again.", "mockup": "<div class=\"mk-side\"><div class=\"mk\"><div class=\"mk-modal\"><div class=\"mk-field\">🔍 <span class=\"q\">where did we land on saved cards<\/span><span class=\"mk-scope\"><span class=\"on\">Search <span style=\"opacity:.6\">⇧⌘A<\/span><\/span><span class=\"\">Jump <span style=\"opacity:.6\">⌘K<\/span><\/span><\/span><\/div><div class=\"mk-filters\"><span class=\"mk-pop\">All projects ▾<\/span><span class=\"mk-pop\">Any kind ▾<\/span><span class=\"mk-pop\">Any time ▾<\/span><span>☐ Include archived<\/span><span class=\"mk-hint\">⇧⌘A again: this project<\/span><\/div><div class=\"mk-body\"><div class=\"mk-row sel\"><div class=\"t\"><span class=\"mono\">docs/prd-v2.md<\/span><\/div><div class=\"m\">checkout-redesign · file · L40–58<\/div><\/div><div class=\"mk-row\"><div class=\"t\">PRD v2 edits<\/div><div class=\"m\">checkout-redesign · session · turn 6 · by meaning<\/div><\/div><\/div><div class=\"mk-foot\"><span>↩ Open in checkout-redesign<\/span><span class=\"r\">tab Actions · esc Close<\/span><\/div><\/d >🔍 <span class=\"q\">where did we land on saved cards<\/span><span class=\"mk-scope\"><span class=\"on\">Search <span style=\"opacity:.6\">⇧⌘A<\/span><\/span><span class=\"\">Jump <span style=\"opacity:.6\">⌘K<\/span><\/span><\/span><\/div><div class=\"mk-filters\"><span class=\"mk-pop focus\">All projects ▾<\/span><span class=\"mk-pop\">Any kind ▾<\/span><span class=\"mk-pop\">Any time ▾<\/span><span>☐ Include archived<\/span><\/div><div class=\"mk-body\"><div class=\"mk-row sel\"><div class=\"t\"><span class=\"mono\">docs/prd-v2.md<\/span><\/div><div class=\"m\">checkout-redesign · file · L40–58<\/div><\/div><div class=\"mk-row\"><div class=\"t\">PRD v2 edits<\/div><div class=\"m\">checkout-redesign · session · turn 6 · by meaning<\/div><\/div><\/div><div class=\"mk-foot\"><span>↩ Open in checkout-redesign<\/span><span class=\"r\">tab Actions · ⇧tab Filters · esc Close<\/span><\/div><\/div><\/div><div class=\"mk-caption\">After ⇧Tab: the scope pop-up has the focus ring.<\/div>"}, {"id": "mouse", "label": "No: filters by mouse (and VoiceOver) only", "desc": "Fewer keys to learn; the filters aren't reachable from the keyboard."}]}, {"id": "q23c-multi", "ref": "Q-23 · search-handoff §4, search-multi", "title": "Search: ⇧↑ / ⇧↓ select several results", "context": ["Selecting several results lets **Return send them all** to Claude at once, as references (path with lines, session with turn), not pasted text, never submitted. The design proposes ⇧↑/⇧↓ to extend the selection, like a Finder list."], "options": [{"id": "yes", "label": "Yes, ⇧↑ / ⇧↓", "recommended": true, "desc": "Plus ⌘-click with the mouse.", "mockup": "<div class=\"mk\"><div class=\"mk-modal\"><div class=\"mk-field\">🔍 <span class=\"q\">where did we land on saved cards<\/span><span class=\"mk-scope\"><span class=\"on\">Search <span style=\"opacity:.6\">⇧⌘A<\/span><\/span><span class=\"\">Jump <span style=\"opacity:.6\">⌘K<\/span><\/span><\/span><\/div><div class=\"mk-filters\"><span class=\"mk-pop\">All k-pop\">Any kind ▾<\/span><span class=\"mk-pop\">Any time ▾<\/span><span>☐ Include archived<\/span><span class=\"mk-hint\">Every literal occurrence · ⌘E for meaning and words<\/span><\/div><div class=\"mk-body\"><div class=\"mk-row sel\"><div class=\"t\"><span class=\"mono\">spec/errors.md<\/span><span class=\"mk-pill\">exact<\/span><\/div><div class=\"m\">refunds-api-spec · file · L77<\/div><\/div><div class=\"mk-row\"><div class=\"t\">Edge-case matrix<span class=\"mk-pill\">exact<\/span><\/div><div class=\"m\">refunds-api-spec · session · turn 9<\/div><\/div><\/div><div class=\"mk-foot\"><span>↩ Open in refunds-api-spec<\/span><span class=\"r\">tab Actions · ⇧tab Filters · esc Close<\/span><\/div><\/div><\/div>"}, {"id": "chip-only", "label": "No chord: automatic, plus the chip", "desc": "Quotes or identifiers turn it on; click the chip's × to turn it off."}]}, {"id": "q23e-action-keys", "ref": "Q-23 · search-handoff §4–5, search-actions-file", "title": "Search: direct shortcuts on the actions", "context": ["Return runs the main action and Tab opens the actions menu (both yours). The design proposes direct chords so you needn't open the menu:", ["`⌘↩` Send to Claude · `⌥⌘↩` open in split view (not built) · `⇧⌘↩` open a session read-only at the turn", "`⌥⌘C` copy path (files) / copy resume command (sessions) · `⇧⌘C` copy passage · `⌘R` reveal in Finder"], "**One clash:** `⌘↩` already means \"jump into the selected project\" in the peek (⇧⌘P). The peek and search are never open together, so it works, but one chord would have two meanings. If you choose ⌘D in decision 22, Send to Claude could be ⌘D here too."], "options": [{"id": "as-proposed", "label": "All as proposed (⌘↩ sends)", "desc": "Matches the design exactly; ⌘↩ means two things in two places.", "mockup": "<div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Actions (Tab) · file result<\/div><div class=\"mk-item hl\"><span>Open<\/span><span class=\"k\">↩<\/span><\/div><div class=\"mk-item \"><span>Open in split view<\/span><span class=\"k\">⌥⌘↩<\/span><\/div><div class=\"mk-item \"><span>Go to checkout-redesign<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Send to Claude in Morning triage<\/span><span class=\"k\">⌘↩<\/span><\/div><div class=\"mk-item \"><span>Find similar<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Show all 3 passages<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Copy path<\/span><span class=\"k\">⌥⌘C<\/span><\/div><div class=\"mk-item \"><span>Copy passage<\/span><span class=\"k\">⇧⌘C<\/span><\/div><div class=\"mk-item \"><span>Copy Markdown link<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Reveal in Finder<\/span><span class=\"k\">⌘R<\/span><\/div><\/div><\/div>"}, {"id": "send-matches-22", "label": "As proposed, but Send to Claude uses decision 22's chord", "recommended": true, "desc": "One chord for \"send to Claude\" everywhere (⌘D if you pick it); ⌘↩ keeps one meaning.", "mockup": "<div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Actions (Tab) · file result<\/div><div class=\"mk-item hl\"><span>Open<\/span><span class=\"k\">↩<\/span><\/div><div class=\"mk-item \"><span>Open in split view<\/span><span class=\"k\">⌥⌘↩<\/span><\/div><div class=\"mk-item \"><span>Go to checkout-redesign<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Send to Claude in Morning triage<\/span><span class=\"k\">⌘D<\/span><\/div><div class=\"mk-item \"><span>Find similar<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Show all 3 passages<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Copy path<\/span><span class=\"k\">⌥⌘C<\/span><\/div><div class=\"mk-item \"><span>Copy passage<\/span><span class=\"k\">⇧⌘C<\/span><\/div><div class=\"mk-item \"><span>Copy Markdown link<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Reveal in Finder<\/span><span class=\"k\">⌘R<\/span><\/div><\/div><\/div>"}, {"id": "menu-only", "label": "No direct chords: Tab, arrows, Return", "desc": "Fewer chords to learn; two keystrokes for anything but the main action.", "mockup": "<div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Actions (Tab) · file result<\/div><div class=\"mk-item hl\"><span>Open<\/span><span class=\"k\">↩<\/span><\/div><div class=\"mk-item \"><span>Open in split view<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Go to checkout-redesign<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Send to Claude in Morning triage<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Find similar<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Show all 3 passages<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Copy path<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Copy passage<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Copy Markdown link<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item \"><span>Reveal in Finder<\/span><span class=\"k\"><\/span><\/div><\/div><\/div>"}]}, {"id": "q23f-send-target", "ref": "Q-23 · search-handoff §2 Q4, DL-69", "title": "Search: which session \"Send to Claude\" goes to", "context": ["Elsewhere in Duo, Send to Claude goes to the Claude session showing in the dark pane (the console in a project, Home's at All projects), with **Send To ▸** for others (DL-69). The design proposes the same for search, naming the session in the item: *Send to Claude in Morning triage*."], "options": [{"id": "same-rule", "label": "Same rule as everywhere: the dark pane's session, named", "recommended": true, "desc": "Plus Send To ▸ in the actions menu for the others.", "mockup": "<div class=\"mk\"><div class=\"mk-menu\"><div class=\"ttl\">Actions (Tab)<\/div><div class=\"mk-item \"><span>Open<\/span><span class=\"k\">↩<\/span><\/div><div class=\"mk-sep\"><\/div><div class=\"mk-item hl\"><span>Send to Claude in Morning triage<\/span><span class=\"k\"><\/span><\/div><div class=\"mk-item \"><span>Send To<\/span><span class=\"k\">▸<\/span><\/div><div class=\"mk-item \"><span>Find similar<\/span><span class=\"k\"><\/span><\/div><\/div><\/div>"}, {"id": "always-home", "label": "Always Home's session", "desc": "Search is often triage; Home is where triage happens."}, {"id": "ask", "label": "Ask each time", "desc": "A small picker of running sessions."}]}, {"id": "q23g-empty", "ref": "Q-23 · search-handoff §2 Q3, search-empty", "title": "Search: what shows before you type", "context": ["The design's proposal: recent searches (arrow keys pick one), and three lines of help. No suggestions."], "options": [{"id": "recents-help", "label": "Recent searches and help", "recommended": true, "desc": "As designed.", "mockup": "<div class=\"mk\"><div class=\"mk-modal\"><div class=\"mk-field\">🔍 <span class=\"ph\">Search all projects<\/span><span class=\"mk-scope\"><span class=\"on\">Search <span style=\"opacity:.6\">⇧⌘A<\/span><\/span><span class=\"\">Jump <span style=\"opacity:.6\">⌘K<\/span><\/span><\/span><\/div><div class=\"mk-filters\"><span class=\"mk-pop\">All projects ▾<\/span><span class=\"mk-pop\">Any kind ▾<\/span><span class=\"mk-pop\">Any time ▾<\/span><span>☐ Include archived<\/span><\/div><div class=\"mk-body\"><div class=\"mk-sec\">RECENT SEARCHES<\/div><div class=\"mk-row\"><div class=\"t\">where did we land on saved cards<\/div><div class=\"m\">today<\/div><\/div><div class=\"mk-row\"><div class=\"t\">customers charged twice<\/div><div class=\"m\">yesterday<\/div><\/div><div class=\"mk-row\"><div class=\"t\"><span class=\"mono\">ERR_REFUND_409<\/span><\/div><div class=\"m\">3d<\/div><\/div><div class=\"mk-help\" style=\"margin-top:6px\">Search every project by meaning or by exact words.<\/div><div class=\"mk-help\">Put a phrase in quotes, or paste an identifier, to match it exactly.<\/div><div class=\"mk-help\">⌘K switches to jumping to a project, group or session by name.<\/div><\/div><div class=\"mk-foot\"><span>↑↓ Recent searches<\/span><span class=\"r\">⌘K Jump by name · esc Close<\/span><\/div><\/div><\/div>"}, {"id": "recents", "label": "Recent searches only", "desc": "Drop the help lines."}, {"id": "nothing", "label": "Nothing until you type", "desc": "An empty field and the filters."}]}, {"id": "q23h-esc", "ref": "Q-23 · search-handoff §5", "title": "Search: Esc steps back one level", "context": ["The proposal: **Esc** closes the actions menu first, then leaves Find similar (back to the previous results), then closes search. A Spotlight-style alternative: Esc always closes."], "options": [{"id": "step-back", "label": "Esc steps back: menu → find similar → close", "recommended": true, "desc": "The footer says what Esc will do (`esc Back to results`)."}, {"id": "close", "label": "Esc always closes search", "desc": "Simpler; leaving Find similar needs a click."}]}], "decisionsIntro": "Pick one option per question (or Something else, with a comment). Mockups are small sketches in Duo's look; the full designs are in `docs/design/search-handoff/` (open `screens/search-actions-file.html` etc. in a browser). Your answers save as you click, like the verdicts below."}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const KEY = "acceptance:" + DATA.sprint;
const LABEL = { accepted: "Accepted", rejected: "Rejected", deferred: "Not now", "": "To do" };
let verdicts = {};   // id -> {status, comment, at}
let answers = {};    // decision id -> {choice, other, comment, at}
let db = null, filter = "all", showCleared = false;

function local(read, value) {
  try { if (read) return JSON.parse(localStorage.getItem(KEY) || "{}"); localStorage.setItem(KEY, JSON.stringify(value)); }
  catch (e) { return read ? {} : undefined; }
}
verdicts = local(true);
try { answers = JSON.parse(localStorage.getItem(KEY + ":decisions") || "{}"); } catch (e) { answers = {}; }

const $ = (s, el = document) => el.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// Inline `code`, **bold** and *italic* in the walk's text.
function rich(parent, text) {
  text.split(/(`[^`]+`|\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/).forEach(part => {
    if (part.length > 2 && part.startsWith("`") && part.endsWith("`")) parent.append(el("code", null, part.slice(1, -1)));
    else if (part.length > 4 && part.startsWith("**") && part.endsWith("**")) parent.append(el("strong", null, part.slice(2, -2)));
    else if (part.length > 2 && part.startsWith("*") && part.endsWith("*")) parent.append(el("em", null, part.slice(1, -1)));
    else parent.append(document.createTextNode(part));
  });
  return parent;
}

$("#title").textContent = DATA.title;
document.title = DATA.title;
rich($("#intro"), DATA.intro || "");
(DATA.setup || []).forEach(s => $("#setup").append(rich(el("li"), s)));

const cards = {};
function build() {
  const list = $("#list");
  let group = null;
  DATA.features.forEach(f => {
    if (f.group !== group) { group = f.group; list.append(el("h2", null, group)); }
    const c = el("section", "card"); c.id = "f-" + f.id;
    const top = el("div", "top");
    top.append(el("h3", null, f.title));
    if (f.ref) top.append(el("span", "ref", f.ref));
    const pill = el("span", "pill"); top.append(pill);
    c.append(top);
    if (f.what) c.append(rich(el("p", "what"), f.what));
    if (f.setup && f.setup.length) {
      const bar = el("div", "setupbar");
      const a = el("a", "setupbtn", "Set up test"); a.href = "duo2://walk-setup?id=" + encodeURIComponent(f.id);
      a.title = "Duo arranges the fixtures for this test: " + f.setup.join(" · ");
      bar.append(a);
      const alt = el("span", "alt"); alt.append("or in a terminal: "); alt.append(el("code", null, "duo2 walk setup " + f.id)); bar.append(alt);
      c.append(bar);
    }
    if (f.claude) {
      const b = el("div", "claude");
      const head = el("div", "head"); head.append("Claude tried this"); head.append(el("span", "pill " + (f.claude.result || ""), f.claude.result || "not run"));
      if (f.claude.at) head.append(el("span", "ref", f.claude.at));
      b.append(head);
      const list = (lbl, items) => { if (!items || !items.length) return; b.append(el("div", "lbl", lbl)); const ul = el("ul"); items.forEach(x => ul.append(rich(el("li"), x))); b.append(ul); };
      list("Did and saw", f.claude.did);
      list("Didn't or couldn't", f.claude.didnt);
      list("Needs your judgment", f.claude.human);
      c.append(b);
    }
    c.append(el("div", "label", "Try"));
    const ol = el("ol", "steps"); f.steps.forEach(s => ol.append(rich(el("li"), s))); c.append(ol);
    c.append(el("div", "label", "Expect"));
    c.append(rich(el("p", "expect"), f.expect));
    const acts = el("div", "actions");
    const mk = (cls, text, status) => { const b = el("button", cls, text); b.setAttribute("aria-pressed", "false"); b.onclick = () => setStatus(f.id, status); acts.append(b); return b; };
    const btns = { accepted: mk("accept", "Accept", "accepted"), rejected: mk("reject", "Reject", "rejected"), deferred: mk("defer", "Not now", "deferred") };
    const saved = el("span", "saved"); acts.append(saved);
    c.append(acts);
    const ta = el("textarea"); ta.placeholder = "Comments (what you saw, what's wrong, what you'd change)";
    let timer;
    ta.oninput = () => { clearTimeout(timer); saved.textContent = "…"; timer = setTimeout(() => setComment(f.id, ta.value), 700); };
    ta.onblur = () => { clearTimeout(timer); if ((verdicts[f.id]?.comment || "") !== ta.value) setComment(f.id, ta.value); };
    c.append(ta);
    list.append(c);
    cards[f.id] = { c, pill, btns, ta, saved };
  });
}

function render() {
  const n = { accepted: 0, rejected: 0, deferred: 0, "": 0 };
  DATA.features.forEach(f => {
    const v = verdicts[f.id] || {}, s = v.status || "", k = cards[f.id];
    n[s] = (n[s] || 0) + 1;
    k.c.className = "card " + s;
    k.pill.className = "pill " + s; k.pill.textContent = LABEL[s];
    for (const [st, b] of Object.entries(k.btns)) b.setAttribute("aria-pressed", String(s === st));
    if (document.activeElement !== k.ta && k.ta.value !== (v.comment || "")) k.ta.value = v.comment || "";
    const show = (filter === "all" || (filter === "todo" ? !s : s === filter)) && (showCleared || !v.cleared);
    k.c.classList.toggle("hidden", !show);
  });
  document.querySelectorAll("#list h2").forEach(h => {
    let e = h.nextElementSibling, any = false;
    while (e && e.tagName !== "H2") { if (!e.classList.contains("hidden")) any = true; e = e.nextElementSibling; }
    h.classList.toggle("hidden", !any);
  });
  const total = DATA.features.length;
  $("#counts").textContent = `${n.accepted} accepted · ${n.rejected} rejected · ${n.deferred} not now · ${n[""]} to do (${total})`;
  const p = $("#progress"); p.textContent = "";
  [["accepted", "var(--ok)"], ["rejected", "var(--bad)"], ["deferred", "var(--later)"]].forEach(([s, col]) => {
    const span = el("span"); span.style.width = (100 * n[s] / total) + "%"; span.style.background = col; p.append(span);
  });
}

async function write(id, patch) {
  const k = cards[id];
  const next = Object.assign({ status: "", comment: "" }, verdicts[id], patch, { at: new Date().toISOString() });
  verdicts[id] = next;
  local(false, verdicts);
  render();
  if (!db) { k.saved.textContent = "Saved in this browser"; return; }
  k.saved.textContent = "Saving…";
  try { await db.doc("verdicts/" + id).set(next); k.saved.textContent = "Saved"; }
  catch (e) { k.saved.textContent = "Not saved (" + (e.code || e.message || "error") + "), kept in this browser"; }
}
function setStatus(id, status) {
  const cur = verdicts[id]?.status || "";
  write(id, { status: cur === status ? "" : status, comment: cards[id].ta.value });
}
function setComment(id, comment) { write(id, { comment }); }

document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

function feedback() {
  const by = s => DATA.features.filter(f => (verdicts[f.id]?.status || "") === s);
  const line = f => {
    const c = (verdicts[f.id]?.comment || "").trim();
    return `- **${f.title}** (\`${f.id}\`${f.ref ? ", " + f.ref : ""})` + (c ? `\n  ${c.replace(/\n/g, "\n  ")}` : "");
  };
  const out = [`# Acceptance feedback: ${DATA.title}`, `Sprint \`${DATA.sprint}\` · ${new Date().toLocaleString()}`, ""];
  const sec = (name, list, all) => {
    const items = all ? list : list.filter(f => (verdicts[f.id]?.comment || "").trim());
    if (!items.length) return;
    out.push(`## ${name} (${list.length})`, ...items.map(line), "");
    if (!all && items.length < list.length) out.splice(out.length - 1, 0, `- ${list.length - items.length} more with no comment`);
  };
  const ds = DATA.decisions || [];
  if (ds.length) {
    out.push(`## Decisions (${ds.filter(d => answers[d.id]?.choice).length} of ${ds.length} answered)`);
    ds.forEach(d => {
      const a = answers[d.id] || {};
      const o = (d.options || []).find(x => x.id === a.choice);
      const pick = a.choice ? (o ? o.label : "Something else") : "not answered";
      out.push(`- **${d.title}** (\`${d.id}\`${d.ref ? ", " + d.ref : ""}): ${pick}` + ((a.comment || "").trim() ? `\n  ${a.comment.trim().replace(/\n/g, "\n  ")}` : ""));
    });
    out.push("");
  }
  sec("Rejected", by("rejected"), true);
  sec("Accepted, with comments", by("accepted"), false);
  sec("Not now", by("deferred"), true);
  const todo = DATA.features.filter(f => !verdicts[f.id]?.status);
  if (todo.length) out.push(`## Not yet tested (${todo.length})`, todo.map(f => f.id).join(", "), "");
  const loose = todo.filter(f => (verdicts[f.id]?.comment || "").trim());
  if (loose.length) out.push(`## Comments on untested items`, ...loose.map(line), "");
  return out.join("\n");
}

// Clear done: accepted tests and answered decisions are hidden (marked cleared, still recorded).
$("#clear").onclick = async () => {
  const fs = DATA.features.filter(f => verdicts[f.id]?.status === "accepted" && !verdicts[f.id]?.cleared);
  const ds = (DATA.decisions || []).filter(d => answers[d.id]?.choice && !answers[d.id]?.cleared);
  if (!fs.length && !ds.length) return;
  for (const f of fs) await write(f.id, { cleared: true });
  for (const d of ds) await writeAnswer(d.id, { cleared: true });
  render(); renderDecisions();
};
$("#showcleared").onclick = () => {
  showCleared = !showCleared;
  $("#showcleared").setAttribute("aria-pressed", String(showCleared));
  render(); renderDecisions();
};

$("#copy").onclick = async () => {
  const text = feedback();
  $("#out").value = text;
  const extra = db ? " Claude can also read your verdicts directly." : "";
  $("#dlgnote").textContent = "Select all and copy, then paste it into Claude." + extra;
  $("#dlg").showModal();
  $("#out").select();
  // The clipboard can be refused (or never answer) inside a frame; the dialog is the fallback.
  Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(no, 1500))])
    .then(() => { $("#dlgnote").textContent = "Copied. Paste it into Claude." + extra; }, () => {});
};
$("#close").onclick = () => $("#dlg").close();

// Decisions Geoff makes from the page: context, options (with small mockups), a pick, comments.
const dcards = {};
function buildDecisions() {
  const list = DATA.decisions || [];
  if (!list.length) return;
  const sec = $("#decisions");
  sec.classList.remove("hidden");
  const h = el("h2", null, "Decisions for you ");
  h.append(el("span", "count", ""));
  sec.append(h);
  if (DATA.decisionsIntro) sec.append(rich(el("p", "intro"), DATA.decisionsIntro));
  list.forEach(d => {
    const c = el("section", "decision"); c.id = "d-" + d.id;
    const top = el("div", "top");
    top.append(el("h3", null, d.title));
    if (d.ref) top.append(el("span", "ref", d.ref));
    const state = el("span", "pill"); top.append(state);
    c.append(top);
    const ctx = el("div", "context");
    (d.context || []).forEach(p => {
      if (Array.isArray(p)) { const ul = el("ul"); p.forEach(x => ul.append(rich(el("li"), x))); ctx.append(ul); }
      else ctx.append(rich(el("p"), p));
    });
    c.append(ctx);
    const opts = el("div", "options");
    const radios = {};
    (d.options || []).concat([{ id: "other", label: "Something else", desc: "Say what in the comment below." }]).forEach(o => {
      const lab = el("label", "option");
      const r = el("input"); r.type = "radio"; r.name = "d-" + d.id; r.value = o.id;
      r.onchange = () => writeAnswer(d.id, { choice: o.id });
      lab.append(r);
      const head = el("div"); head.append(el("span", "olabel", o.label)); if (o.recommended) head.append(el("span", "rec", "Recommended"));
      lab.append(head);
      if (o.desc) lab.append(rich(el("div", "odesc"), o.desc));
      if (o.mockup) { const m = el("div", "mock"); m.innerHTML = o.mockup; lab.append(m); }
      opts.append(lab);
      radios[o.id] = { r, lab };
    });
    c.append(opts);
    const ta = el("textarea"); ta.placeholder = "Comments (why, conditions, what to change)";
    let timer;
    ta.oninput = () => { clearTimeout(timer); timer = setTimeout(() => writeAnswer(d.id, { comment: ta.value }), 700); };
    ta.onblur = () => { clearTimeout(timer); if ((answers[d.id]?.comment || "") !== ta.value) writeAnswer(d.id, { comment: ta.value }); };
    c.append(ta);
    const saved = el("div", "saved"); c.append(saved);
    sec.append(c);
    dcards[d.id] = { c, state, radios, ta, saved, d };
  });
}

function renderDecisions() {
  const list = DATA.decisions || [];
  if (!list.length) return;
  let n = 0;
  list.forEach(d => {
    const a = answers[d.id] || {}, k = dcards[d.id];
    if (a.choice) n++;
    k.c.classList.toggle("answered", !!a.choice);
    k.c.classList.toggle("hidden", !!a.cleared && !showCleared);
    const opt = (d.options || []).find(o => o.id === a.choice);
    k.state.className = "pill" + (a.choice ? " accepted" : "");
    k.state.textContent = a.choice ? (opt ? opt.label : "Something else") : "Open";
    for (const [id, { r, lab }] of Object.entries(k.radios)) { r.checked = a.choice === id; lab.classList.toggle("chosen", a.choice === id); }
    if (document.activeElement !== k.ta && k.ta.value !== (a.comment || "")) k.ta.value = a.comment || "";
  });
  $("#decisions .count").textContent = `(${n} of ${list.length} answered)`;
}

async function writeAnswer(id, patch) {
  const k = dcards[id];
  const next = Object.assign({ choice: "", comment: "" }, answers[id], patch, { at: new Date().toISOString() });
  answers[id] = next;
  try { localStorage.setItem(KEY + ":decisions", JSON.stringify(answers)); } catch (e) {}
  renderDecisions();
  if (!db) { k.saved.textContent = "Saved in this browser"; return; }
  k.saved.textContent = "Saving…";
  try { await db.doc("decisions/" + id).set(next); k.saved.textContent = "Saved"; }
  catch (e) { k.saved.textContent = "Not saved (" + (e.code || e.message || "error") + "), kept in this browser"; }
}

buildDecisions();
renderDecisions();
build();
render();

(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { $("#store").textContent = "Verdicts are saved in this browser only. Use Copy feedback to send them to Claude."; return; }
  $("#store").textContent = "Verdicts are saved with this page; you can stop and come back any time, and Claude can read them.";
  // Anything recorded in this browser before the store connected goes up once.
  const remote = await db.collection("verdicts").get().catch(() => null);
  const have = new Set(remote ? remote.docs.map(d => d.id) : []);
  for (const [id, v] of Object.entries(verdicts)) if (!have.has(id) && cards[id] && (v.status || v.comment)) db.doc("verdicts/" + id).set(v).catch(() => {});
  const remoteD = await db.collection("decisions").get().catch(() => null);
  const haveD = new Set(remoteD ? remoteD.docs.map(d => d.id) : []);
  for (const [id, a] of Object.entries(answers)) if (!haveD.has(id) && dcards[id] && (a.choice || a.comment)) db.doc("decisions/" + id).set(a).catch(() => {});
  db.collection("decisions").onSnapshot(snap => {
    snap.docs.forEach(d => { if (dcards[d.id]) answers[d.id] = d.data(); });
    try { localStorage.setItem(KEY + ":decisions", JSON.stringify(answers)); } catch (e) {}
    renderDecisions();
  }, () => {});
  db.collection("verdicts").onSnapshot(snap => {
    snap.docs.forEach(d => { if (cards[d.id]) verdicts[d.id] = d.data(); });
    local(false, verdicts);
    render();
  }, e => { $("#store").textContent = "Lost the connection to saved verdicts (" + (e.code || "error") + "); changes are kept in this browser."; });
})();
</script>

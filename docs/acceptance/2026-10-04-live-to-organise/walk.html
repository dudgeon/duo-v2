<html lang="en">
<head>

<title>Duo acceptance: live workspace to collisions</title>
<style>
:root {

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1d; --card: #252528; --ink: #ececee; --muted: #9a9aa0; --line: #38383c;
    --chip: #303034; --accent: #6b9cf0; --ok: #5ccb8a; --ok-bg: #1d3427; --bad: #f0786d; --bad-bg: #3d2220;

  }
}

  --bg: #1b1b1d; --card: #252528; --ink: #ececee; --muted: #9a9aa0; --line: #38383c;
  --chip: #303034; --accent: #6b9cf0; --ok: #5ccb8a; --ok-bg: #1d3427; --bad: #f0786d; --bad-bg: #3d2220;
  --later: #e2c264; --later-bg: #3a321b; --code: #2e2e32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
code { font: 12.5px "SF Mono", ui-monospace, Menlo, monospace; background: var(--code); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
h1 { font-size: 17px; margin: 0; flex: 1 1 260px; }
.progress { flex: 1 1 100%; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; display: flex; }
.progress span { display: block; height: 100%; }
.counts { color: var(--muted); font-size: 12.5px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 5px 11px; }
button:hover { border-color: var(--muted); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.primary:hover { border-color: var(--accent); filter: brightness(1.08); }
main { max-width: 860px; margin: 0 auto; padding: 8px 16px 80px; }
.intro { color: var(--muted); margin: 14px 0 4px; }
.setup { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0 6px; }
.setup ol { margin: 4px 0; padding-left: 20px; }
.store { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; }
.card.accepted { border-left-color: var(--ok); }
.card.rejected { border-left-color: var(--bad); }
.card.deferred { border-left-color: var(--later); }
.top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.top h3 { font-size: 15px; margin: 0; flex: 1 1 240px; }
.ref { font-size: 11.5px; color: var(--muted); }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; background: var(--chip); color: var(--muted); }
.pill.accepted { background: var(--ok-bg); color: var(--ok); }
.pill.rejected { background: var(--bad-bg); color: var(--bad); }
.pill.deferred { background: var(--later-bg); color: var(--later); }
.what { margin: 4px 0 8px; color: var(--muted); }
.label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-top: 6px; }
ol.steps { margin: 2px 0 6px; padding-left: 20px; }
.expect { margin: 2px 0 10px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.actions .accept[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.actions .reject[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.actions .defer[aria-pressed="true"] { background: var(--later); border-color: var(--later); color: #fff; }
.saved { font-size: 11.5px; color: var(--muted); margin-left: auto; }
textarea { width: 100%; min-height: 54px; margin-top: 8px; resize: vertical; font: inherit; color: inherit;
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; }
.hidden { display: none; }
dialog { max-width: min(720px, calc(100vw - 32px)); width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); padding: 16px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog textarea { min-height: 320px; font: 12.5px "SF Mono", ui-monospace, Menlo, monospace; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.row .note { margin-right: auto; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title"></h1>

    <button class="primary" id="copy">Copy feedback for Claude</button>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="filters" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="todo" aria-pressed="false">To do</button>
      <button data-f="accepted" aria-pressed="false">Accepted</button>
      <button data-f="rejected" aria-pressed="false">Rejected</button>
      <button data-f="deferred" aria-pressed="false">Not now</button>
    </div>
  </div>
</header>
<main>
  <p class="intro" id="intro"></p>
  <div class="setup"><div class="label">Before you start</div><ol id="setup"></ol>
    <p class="store" id="store">Connecting to saved verdicts…</p></div>
  <div id="list"></div>
</main>
<dialog id="dlg">
  <strong>Feedback for Claude</strong>
  <textarea id="out" readonly></textarea>
  <div class="row"><span class="note" id="dlgnote"></span><button id="close">Close</button></div>
</dialog>

s nothing; either answer is remembered.", "ref": "DL-50"}, {"id": "app-menus", "group": "App", "title": "Menus", "what": "File (New Markdown File, New Folder, Save, Close Tab, Close Window), Edit (text items, Find, Spelling), Format, View, Go.", "steps": ["Open each menu; try Go › All Projects and Go › Home."], "expect": "Items are present and work; disabled ones are greyed when they don't apply.", "ref": "F-43"}, {"id": "app-clear", "group": "App", "title": "`/clear` keeps the tab with the session", "what": "After `/clear` in a terminal, the tab follows the new conversation.", "steps": ["In a session, type `/clear`, then a short prompt."], "expect": "The tab is renamed after the new conversation; the old session is still listed.", "ref": "F-29"}, {"id": "send-doc-selection", "group": "Send to Claude", "title": "Send selected text from a document", "what": "Selected Markdown goes to the prompt quoted, with its file and lines.", "steps": ["Open `docs/prd.md`, select the Goals list.", "Right-click › Send Selection to Claude. Then try Edit › Send Selection to Claude."], "expect": "The prompt shows a pasted block (`[Pasted text +N lines]`) starting `From docs/prd.md, lines …:` with the text quoted. Nothing is sent. (No shortcut yet: Q-22.)", "ref": "DL-67, DL-68"}, {"id": "send-session-project", "group": "Send to Claude", "title": "Send a session or a project", "what": "Right-click a session row or a project tile.", "steps": ["In checkout, right-click a session row › Send to Claude.", "Go to All projects, right-click the refunds tile › Send to Claude (Home's session receives it)."], "expect": "A short block naming the session (id, how to read it) or the project (folder, PROJECT.md, goal, health, next). Duo switches to the receiving session with the cursor in its prompt.", "ref": "DL-67"}, {"id": "send-why-not", "group": "Send to Claude", "title": "Says why it can't send", "what": "Send to Claude names the reason when the visible tab can't take context.", "steps": ["Click `+ New session` and at once, before Claude's prompt appears, right-click a file.", "Close every session in the project (⌘W on each) and right-click a file."], "expect": "The item reads like `Send to Claude: Claude isn't ready yet` or `…: No session is showing`, greyed out; Send To ▸ still lists other sessions and New Session.", "ref": "DL-69, F-46"}, {"id": "html-view", "group": "HTML pages", "title": "HTML files open as live pages", "what": "Read-only, reloaded when the page or its css/js/images change; links to sites open in your browser.", "steps": ["In checkout, open `prototypes/checkout.html`.", "Edit `prototypes/checkout.css` in another editor: change `.primary { background: #2f6fde` to `orange`, save.", "Click `Shipping policy`."], "expect": "The page shows with its styles and card image; within a second of saving the button turns orange; the link opens in your browser, not in Duo. (The tab has no chrome yet: Q-21.)", "ref": "DL-67, F-46"}, {"id": "html-selection", "group": "HTML pages", "title": "Send text and images from a page", "what": "Select across text and the card image, or right-click just the image.", "steps": ["Select from the card image through `Pay as a guest…`, right-click › Send Selection to Claude.", "Right-click only the card image › Send Image to Claude."], "expect": "The prompt gets the quoted text and `image: …/prototypes/card.svg (alt \"A payment card\")`.", "ref": "DL-67"}, {"id": "html-picker", "group": "HTML pages", "title": "Select an element and ask Claude to change it", "what": "The workflow you asked for: Select Element › click a button › Send › “make this button yellow”.", "steps": ["With a checkout session showing, right-click the page › Select Element.", "Move over the page (outlines follow), click `Pay now`.", "In the bar under the page, Send to Claude.", "Type `make this button yellow` and press Return."], "expect": "The prompt shows `[Image #1]` (the element's screenshot) and a pasted block with `<button#pay.cta.primary>`, selector `#pay`, `under: Checkout › Payment`, styles and HTML. Claude edits `checkout.css` and the page turns yellow by itself. (Plain look for now: Q-21.)", "ref": "DL-67, DL-70, LR-44"}, {"id": "html-picker-keys", "group": "HTML pages", "title": "Picker: Pick Another, Esc, Send To", "what": "Leaving and redirecting the picker.", "steps": ["Select Element, click a heading, then Pick Another and click the input.", "Send To ▸ New Session.", "Select Element again, press Esc."], "expect": "Pick Another unfreezes; New Session starts one and pastes there once ready; Esc removes the outline and the bar.", "ref": "DL-70"}, {"id": "cli-help", "group": "duo2 command line", "title": "duo2 covers everything (help and reference)", "what": "One registry; help and the reference are generated (DL-71, DL-72).", "steps": ["`duo2 help`, then `duo2 help files`.", "Open `docs/cli/duo2.md` and `docs/features/duo2.md` in the repo."], "expect": "Everyday verbs, then 10 families; the reference lists every verb with where you'd do it in the app, and the few UI-only items with reasons.", "ref": "DL-71–DL-73, F-47"}, {"id": "cli-agent-drives", "group": "duo2 command line", "title": "Claude drives Duo", "what": "Ask a session to do things you'd do by hand.", "steps": ["In a checkout session: `Using duo2, open docs/research.md in Duo, then rename it to interview-research.md.`", "Then: `What do I have selected in Duo?` after selecting a sentence in a document."], "expect": "Duo shows research.md, then the file and its tab are renamed. Claude answers the second with your selection (it runs `duo2 selection`).", "ref": "DL-71"}, {"id": "cli-doc-edit", "group": "duo2 command line", "title": "Claude edits an open document through Duo", "what": "`duo2 doc insert` / `doc replace` change the editor's buffer, highlighted as added by Claude.", "steps": ["Open `docs/prd.md`. In a checkout session: `Use duo2 doc replace to change \"Checkout PRD\" to \"Checkout PRD (v2)\".`"], "expect": "The title changes in front of you, highlighted until you type; the file autosaves.", "ref": "LR-34, F-47"}, {"id": "cli-confirm", "group": "duo2 command line", "title": "Moves from the CLI still ask you", "what": "`session move` and `project merge` show Duo's sheet; the command waits.", "steps": ["In a Home session: `Use duo2 to move the scratch session \"Draft a post about pricing\" to checkout.`", "Click Cancel on the sheet; ask again and click Move; then `duo2 undo`."], "expect": "Cancel: Claude reports it wasn't moved. Move: it's filed in checkout. Undo puts it back.", "ref": "DL-66, DL-71"}, {"id": "install-consent", "group": "Install", "title": "One question before writing into ~/.claude", "what": "Duo asks once, listing every change (DL-75).", "steps": ["Launch Duo with `open-duo.sh`: an alert lists 4 changes. Choose Install (or Not Now, then later `duo2 install`).", "`duo2 doctor`; look at the end of `~/.claude/CLAUDE.md`, `~/.claude/skills/duo2/SKILL.md`, and `ls -l ~/.local/bin/duo2`."], "expect": "Install: a short `<!-- duo2:begin … -->` block after your own text, the skill, and the link into Duo.app; doctor says each is current. Not Now: nothing written, not asked again until the list changes.", "ref": "DL-74, DL-75, F-48"}, {"id": "install-outside", "group": "Install", "title": "Claude sessions outside Duo know about it", "what": "The block, skill and PATH link reach sessions you start in Terminal.", "steps": ["In Terminal.app (not Duo): `cd ~/DuoAcceptance/workspace/payments/checkout && claude`, then ask `What's Duo? Use duo2 to list my projects.`"], "expect": "Claude knows Duo from the block, runs `duo2 projects` and lists them (with Duo running). If its sandbox blocks the socket, `duo2 doctor` says how to allow it.", "ref": "DL-74"}, {"id": "install-respect", "group": "Install", "title": "Your edits win; uninstall is exact", "what": "Edited pieces are left alone; a deleted block stays deleted.", "steps": ["Edit a word inside the duo2 block, relaunch Duo, check it's unchanged.", "Delete the whole block, relaunch, check it didn't come back.", "`duo2 uninstall`."], "expect": "Your edit stays; the deleted block stays deleted; uninstall removes the skill and the link and leaves your own CLAUDE.md text (and legacy's block, if any) alone.", "ref": "DL-74, F-48"}, {"id": "g5-at", "group": "Try, then decide", "title": "Claude Code's own @ autocomplete", "what": "Before Duo builds its own (ENH-3, on hold), try Claude's.", "steps": ["In a checkout session, type `@pro` and wait.", "Pick `prototypes/checkout.html` from the list."], "expect": "Claude Code offers files and folders from the session's folder and fills in the path. Use the comment box to say whether Duo should go further (other projects, Home).", "ref": "ENH-3, G-5"}, {"id": "agent-edit-open", "group": "Claude edits open documents", "title": "Claude's edits land in the editor, highlighted", "what": "Duo's sessions route Claude's Edit/Write on a document you have open through Duo's editor (DL-78).", "steps": ["Open `docs/prd.md` in checkout. In a checkout session, ask (no mention of Duo): `Add a goal to the PRD: ship Apple Pay by December`."], "expect": "The new goal appears in the editor highlighted, without a permission prompt; Claude says it's done; the file on disk has it a second later. ⌘Z undoes it.", "ref": "DL-78, F-49"}, {"id": "agent-edit-while-typing", "group": "Claude edits open documents", "title": "Claude edits while you type", "what": "Your unsaved typing and Claude's change merge.", "steps": ["Ask Claude for an edit near the end of the PRD, and while it works, keep typing in the Problem section."], "expect": "Both your typing and Claude's change are there; nothing you typed disappears.", "ref": "DL-77, DL-78"}, {"id": "agent-edit-doctor", "group": "Claude edits open documents", "title": "Hooks status, and the backup without them", "what": "Hooks can be turned off by a managed setting; Duo says so, and the primer and merge still hold.", "steps": ["In a Duo session's terminal: `duo2 doctor`.", "Optional, on the work Mac: if hooks are off there, repeat the Apple Pay request."], "expect": "`Hooks: running in this session…` here. Without hooks, Claude should use `duo2 doc edit` (Opus did in testing; Haiku didn't), and a direct write still shows up highlighted and never over your unsaved text.", "ref": "DL-78, F-49"}, {"id": "col-merge", "group": "Collisions with disk", "title": "Typing while something else writes the file", "what": "Changes to different lines merge (DL-77).", "steps": ["Open `docs/prd.md`. In Terminal run `sleep 5; sed -i '' 's/Decide on saved cards/Decide on saved cards (Oct 10)/' ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md`", "Switch to Duo straight away and keep typing in the `## Goals` heading for a few seconds."], "expect": "Your heading change stays; the outside change appears highlighted; the file on disk ends up with both.", "ref": "DL-77, F-50"}, {"id": "col-conflict", "group": "Collisions with disk", "title": "Both edit the same line", "what": "A real overlap keeps your text and asks.", "steps": ["In Terminal run `sleep 5; sed -i '' 's/## Open questions/## Open questions (theirs)/' ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md`, then switch to Duo and keep typing at the end of the `## Open questions` heading.", "Read the bar under the document; choose Use Theirs. Repeat the race and choose Keep Mine.", "`duo2 doc history ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md`"], "expect": "A bar: `Changed on disk where you're editing (line …). Both versions are kept.` with Use Theirs / Keep Mine; autosave waits for your choice. History lists the version as opened and both sides. (Plain look: Q-20.)", "ref": "DL-77, F-50"}, {"id": "col-switch", "group": "Collisions with disk", "title": "Nothing lost when you look away", "what": "Unsaved text survives switching documents, even mid-conflict.", "steps": ["Make a conflict as above, then open `docs/research.md` and come back to `prd.md`."], "expect": "Your text and the bar are still there.", "ref": "DL-77"}, {"id": "col-removed", "group": "Collisions with disk", "title": "File removed on disk", "what": "The text stays, with a way to put it back.", "steps": ["With `prd.md` open: `mv ~/DuoAcceptance/workspace/payments/checkout/docs/prd.md /tmp/prd-moved.md` in Terminal.", "Click Save to Recreate. Then move /tmp/prd-moved.md back if you like."], "expect": "`Removed on disk. Your text is still here.` and Save to Recreate writes it back; nothing autosaves it back on its own.", "ref": "DL-77"}, {"id": "col-quit", "group": "Collisions with disk", "title": "Quitting right after typing", "what": "The last second's typing is saved on quit.", "steps": ["Type a word in a document and press ⌘Q immediately.", "Open the file in another editor."], "expect": "The word is in the file.", "ref": "DL-77"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const KEY = "acceptance:" + DATA.sprint;
const LABEL = { accepted: "Accepted", rejected: "Rejected", deferred: "Not now", "": "To do" };
let verdicts = {};   // id -> {status, comment, at}
let db = null, filter = "all";

function local(read, value) {
  try { if (read) return JSON.parse(localStorage.getItem(KEY) || "{}"); localStorage.setItem(KEY, JSON.stringify(value)); }
  catch (e) { return read ? {} : undefined; }
}
verdicts = local(true);

const $ = (s, el = document) => el.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// Inline `code` in the fixture text.
function rich(parent, text) {
  text.split(/(`[^`]+`)/).forEach(part => {
    if (part.startsWith("`") && part.endsWith("`") && part.length > 2) parent.append(el("code", null, part.slice(1, -1)));
    else parent.append(document.createTextNode(part));
  });
  return parent;
}

$("#title").textContent = DATA.title;
document.title = DATA.title;
rich($("#intro"), DATA.intro || "");
(DATA.setup || []).forEach(s => $("#setup").append(rich(el("li"), s)));

const cards = {};
function build() {
  const list = $("#list");
  let group = null;
  DATA.features.forEach(f => {
    if (f.group !== group) { group = f.group; list.append(el("h2", null, group)); }
    const c = el("section", "card"); c.id = "f-" + f.id;
    const top = el("div", "top");
    top.append(el("h3", null, f.title));
    if (f.ref) top.append(el("span", "ref", f.ref));
    const pill = el("span", "pill"); top.append(pill);
    c.append(top);
    if (f.what) c.append(rich(el("p", "what"), f.what));
    c.append(el("div", "label", "Try"));
    const ol = el("ol", "steps"); f.steps.forEach(s => ol.append(rich(el("li"), s))); c.append(ol);
    c.append(el("div", "label", "Expect"));
    c.append(rich(el("p", "expect"), f.expect));
    const acts = el("div", "actions");
    const mk = (cls, text, status) => { const b = el("button", cls, text); b.setAttribute("aria-pressed", "false"); b.onclick = () => setStatus(f.id, status); acts.append(b); return b; };
    const btns = { accepted: mk("accept", "Accept", "accepted"), rejected: mk("reject", "Reject", "rejected"), deferred: mk("defer", "Not now", "deferred") };
    const saved = el("span", "saved"); acts.append(saved);
    c.append(acts);
    const ta = el("textarea"); ta.placeholder = "Comments (what you saw, what's wrong, what you'd change)";
    let timer;
    ta.oninput = () => { clearTimeout(timer); saved.textContent = "…"; timer = setTimeout(() => setComment(f.id, ta.value), 700); };
    ta.onblur = () => { clearTimeout(timer); if ((verdicts[f.id]?.comment || "") !== ta.value) setComment(f.id, ta.value); };
    c.append(ta);
    list.append(c);
    cards[f.id] = { c, pill, btns, ta, saved };
  });
}

function render() {
  const n = { accepted: 0, rejected: 0, deferred: 0, "": 0 };
  DATA.features.forEach(f => {
    const v = verdicts[f.id] || {}, s = v.status || "", k = cards[f.id];
    n[s] = (n[s] || 0) + 1;
    k.c.className = "card " + s;
    k.pill.className = "pill " + s; k.pill.textContent = LABEL[s];
    for (const [st, b] of Object.entries(k.btns)) b.setAttribute("aria-pressed", String(s === st));
    if (document.activeElement !== k.ta && k.ta.value !== (v.comment || "")) k.ta.value = v.comment || "";
    const show = filter === "all" || (filter === "todo" ? !s : s === filter);
    k.c.classList.toggle("hidden", !show);
  });
  document.querySelectorAll("#list h2").forEach(h => {
    let e = h.nextElementSibling, any = false;
    while (e && e.tagName !== "H2") { if (!e.classList.contains("hidden")) any = true; e = e.nextElementSibling; }
    h.classList.toggle("hidden", !any);
  });
  const total = DATA.features.length;
  $("#counts").textContent = `${n.accepted} accepted · ${n.rejected} rejected · ${n.deferred} not now · ${n[""]} to do (${total})`;
  const p = $("#progress"); p.textContent = "";
  [["accepted", "var(--ok)"], ["rejected", "var(--bad)"], ["deferred", "var(--later)"]].forEach(([s, col]) => {
    const span = el("span"); span.style.width = (100 * n[s] / total) + "%"; span.style.background = col; p.append(span);
  });
}

async function write(id, patch) {
  const k = cards[id];
  const next = Object.assign({ status: "", comment: "" }, verdicts[id], patch, { at: new Date().toISOString() });
  verdicts[id] = next;
  local(false, verdicts);
  render();
  if (!db) { k.saved.textContent = "Saved in this browser"; return; }
  k.saved.textContent = "Saving…";
  try { await db.doc("verdicts/" + id).set(next); k.saved.textContent = "Saved"; }
  catch (e) { k.saved.textContent = "Not saved (" + (e.code || e.message || "error") + "), kept in this browser"; }
}
function setStatus(id, status) {
  const cur = verdicts[id]?.status || "";
  write(id, { status: cur === status ? "" : status, comment: cards[id].ta.value });
}
function setComment(id, comment) { write(id, { comment }); }

document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

function feedback() {
  const by = s => DATA.features.filter(f => (verdicts[f.id]?.status || "") === s);
  const line = f => {
    const c = (verdicts[f.id]?.comment || "").trim();
    return `- **${f.title}** (\`${f.id}\`${f.ref ? ", " + f.ref : ""})` + (c ? `\n  ${c.replace(/\n/g, "\n  ")}` : "");
  };
  const out = [`# Acceptance feedback: ${DATA.title}`, `Sprint \`${DATA.sprint}\` · ${new Date().toLocaleString()}`, ""];
  const sec = (name, list, all) => {
    const items = all ? list : list.filter(f => (verdicts[f.id]?.comment || "").trim());
    if (!items.length) return;
    out.push(`## ${name} (${list.length})`, ...items.map(line), "");
    if (!all && items.length < list.length) out.splice(out.length - 1, 0, `- ${list.length - items.length} more with no comment`);
  };
  sec("Rejected", by("rejected"), true);
  sec("Accepted, with comments", by("accepted"), false);
  sec("Not now", by("deferred"), true);
  const todo = DATA.features.filter(f => !verdicts[f.id]?.status);
  if (todo.length) out.push(`## Not yet tested (${todo.length})`, todo.map(f => f.id).join(", "), "");
  const loose = todo.filter(f => (verdicts[f.id]?.comment || "").trim());
  if (loose.length) out.push(`## Comments on untested items`, ...loose.map(line), "");
  return out.join("\n");
}

$("#copy").onclick = async () => {
  const text = feedback();
  $("#out").value = text;
  const extra = db ? " Claude can also read your verdicts directly." : "";
  $("#dlgnote").textContent = "Select all and copy, then paste it into Claude." + extra;
  $("#dlg").showModal();
  $("#out").select();
  // The clipboard can be refused (or never answer) inside a frame; the dialog is the fallback.
  Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(no, 1500))])
    .then(() => { $("#dlgnote").textContent = "Copied. Paste it into Claude." + extra; }, () => {});
};
$("#close").onclick = () => $("#dlg").close();

build();
render();

(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { $("#store").textContent = "Verdicts are saved in this browser only. Use Copy feedback to send them to Claude."; return; }
  $("#store").textContent = "Verdicts are saved with this page; you can stop and come back any time, and Claude can read them.";
  // Anything recorded in this browser before the store connected goes up once.
  const remote = await db.collection("verdicts").get().catch(() => null);
  const have = new Set(remote ? remote.docs.map(d => d.id) : []);
  for (const [id, v] of Object.entries(verdicts)) if (!have.has(id) && cards[id] && (v.status || v.comment)) db.doc("verdicts/" + id).set(v).catch(() => {});
  db.collection("verdicts").onSnapshot(snap => {
    snap.docs.forEach(d => { if (cards[d.id]) verdicts[d.id] = d.data(); });
    local(false, verdicts);
    render();
  }, e => { $("#store").textContent = "Lost the connection to saved verdicts (" + (e.code || "error") + "); changes are kept in this browser."; });
})();
</script>
</body>

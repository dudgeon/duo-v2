<script>
(() => {
const S = JSON.parse(document.getElementById("dw-spec").textContent);

                set(k, v) { try { localStorage.setItem(LS + ":" + k, JSON.stringify(v)); } catch (e) {} } };

// ---- state
const CH = S.chapters;
const decisions = CH.filter(c => c.kind === "decision");
const answers = store.get("answers", {});        // id -> {q, choice, label, text, at}
const drafts = {};                                // id -> {choice, text}
let cur = 0, mode = "intro", optIdx = -1, playing = false, started = false, heard = store.get("heard", {});
let db = null, comments = null, canSend = "off", threads = store.get("threads", {});

// ---- stage
const stage = $("#stage");

function scale() { const w = stage.clientWidth; if (world) world.style.transform = "scale(" + (w / 640) + ")"; }
new ResizeObserver(scale).observe(stage);
function buildScene(ch) {

  const tag = el("div", "tag" + (ch.kind === "decision" ? " decide" : ""));
  if (ch.kind === "decision") tag.append(el("span", "dot"));
  tag.append(el("span", "", ch.kind === "decision" ? "Your call · " + ch.q : (ch.label || "Chapter " + (CH.indexOf(ch) + 1))));
  world = el("div", "world"); cam = el("div", "cam"); cam.innerHTML = ch.scene || "";
  cursor = el("div", "dw-cursor"); cursor.innerHTML = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 2l14 8.5-6.2 1.3L7.6 18z" fill="#1f2328" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  cam.append(cursor); world.append(cam); stage.append(tag, world);
  if (ch.hint) stage.append(el("div", "hint", ch.hint));
  world.querySelectorAll("[data-tap]").forEach(t => {
    t.setAttribute("role", "button"); t.tabIndex = 0;
    const go = ev => { ev.stopPropagation(); (ch.actions?.[t.dataset.tap] || []).forEach(c => cue(c, false)); };
    t.addEventListener("click", go); t.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(ev); } });

function poster() {

  const b = el("button", "play"); b.type = "button"; b.setAttribute("aria-label", "Play the walkthrough"); b.innerHTML = '<svg width="26" height="26" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="#ffffff"/></svg>';
  b.onclick = () => { started = true; p.remove(); play(); };
  p.append(b, el("p", "", fmtTotal()));
  stage.append(p);
}
function fmtTotal() { const t = CH.reduce((a, c) => a + c.duration, 0); return "About " + Math.round(t / 60) + " minutes · " + CH.length + " chapters · " + decisions.length + " decisions"; }
const sel = s => s ? [...world.querySelectorAll(s)] : [];
function center(e) { let x = e.offsetWidth / 2, y = e.offsetHeight / 2; for (let n = e; n && n !== cam; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; } return [x, y]; }
function cue(c, instant) {
  const els = sel(c.sel);
  switch (c.do) {
    case "show": els.forEach(e => e.classList.add("on")); break;
    case "hide": els.forEach(e => e.classList.remove("on")); break;
    case "focus": world.querySelectorAll(".focus").forEach(e => e.classList.remove("focus", "soft")); els.forEach(e => { e.classList.add("focus"); if (c.soft) e.classList.add("soft"); }); world.classList.toggle("focusing", els.length > 0); break;
    case "unfocus": world.querySelectorAll(".focus").forEach(e => e.classList.remove("focus", "soft")); world.classList.remove("focusing"); break;
    case "add": els.forEach(e => e.classList.add(...c.cls.split(" "))); break;
    case "remove": els.forEach(e => e.classList.remove(...c.cls.split(" "))); break;
    case "state": world.dataset.state = c.value || ""; break;
    case "state+": { const s = new Set((world.dataset.state || "").split(" ").filter(Boolean)); c.value.split(" ").forEach(v => s.add(v)); world.dataset.state = [...s].join(" "); break; }
    case "state-": { const s = new Set((world.dataset.state || "").split(" ").filter(Boolean)); c.value.split(" ").forEach(v => s.delete(v)); world.dataset.state = [...s].join(" "); break; }
    case "state~": { const s = new Set((world.dataset.state || "").split(" ").filter(Boolean)); c.value.split(" ").forEach(v => s.has(v) ? s.delete(v) : s.add(v)); world.dataset.state = [...s].join(" "); break; }
    case "camera": { const z = c.z || 1, x = c.x ?? 320, y = c.y ?? 200; cam.style.transform = z === 1 && c.x == null ? "" : "translate(" + (320 - x * z) + "px," + (200 - y * z) + "px) scale(" + z + ")"; break; }
    case "text": els.forEach(e => e.textContent = c.value); break;
    case "tap": case "point": {
      const e = els[0]; if (!e) break; const [x, y] = center(e);
      cursor.classList.add("on"); cursor.style.left = (x - 3) + "px"; cursor.style.top = (y - 2) + "px";
      if (c.do === "tap") { if (instant) break; setTimeout(() => { cursor.classList.remove("press"); void cursor.offsetWidth; cursor.classList.add("press"); }, 720); }
      break; }
    case "cursor-off": cursor.classList.remove("on"); break;
    case "count": els.forEach(e => { const to = +c.to, from = parseFloat(e.textContent) || 0, d = (c.dur || 1) * 1000, t0 = performance.now(), dec = c.decimals || 0;
      if (instant) { e.textContent = to.toFixed(dec); return; }
      const step = now => { const k = Math.min(1, (now - t0) / d); e.textContent = (from + (to - from) * (1 - Math.pow(1 - k, 3))).toFixed(dec); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); break;
  }
}
function instantly(fn) { stage.classList.add("instant"); fn(); void stage.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("instant"))); }
function cuesOf(lines) { return lines.flatMap(l => l.cues || []).sort((a, b) => a.t - b.t); }
function runCues(t) { while (applied < cueList.length && cueList[applied].t <= t + 0.02) cue(cueList[applied++], false); }

// ---- clock: an audio file, or a timer for drafts with no audio
const audio = new Audio(); audio.preload = "auto"; audio.setAttribute("playsinline", "");
let clock = null;
function makeClock(src, duration) {
  if (src) {
    return { src, duration, get t() { return audio.currentTime; },
      load() { if (audio.getAttribute("src") !== src) { audio.src = src; } audio.currentTime = 0; },
      play() { return audio.play().catch(() => { playing = false; ui(); }); }, pause() { audio.pause(); } };
  }
  let t = 0, last = 0, raf = 0;
  const c = { duration, get t() { return t; }, load() { t = 0; },
    play() { last = performance.now(); cancelAnimationFrame(raf); const tick = now => { t += (now - last) / 1000; last = now; onTime(); if (t >= duration) { cancelAnimationFrame(raf); onEnded(); return; } raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); },
    pause() { cancelAnimationFrame(raf); } };

}
audio.addEventListener("timeupdate", () => onTime());

  if (ch.kind === "decision") { playing = false; ui(); const p = $(".panel.call"); if (p) { p.classList.remove("waiting"); void p.offsetWidth; p.classList.add("waiting"); if (innerWidth <= 860) p.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }

}

function load(i, opts = {}) {

// ---- captions and progress
function captions() {

  document.querySelectorAll(".seg").forEach((s, i) => { s.querySelector("i").style.width = (i < cur ? 100 : i > cur ? 0 : mode === "intro" ? Math.min(100, 100 * t / CH[i].duration) : 100) + "%"; });

function ui() {

// ---- chapters bar
function buildBar() {
  const nav = $("#chapters"); nav.replaceChildren();
  CH.forEach((c, i) => {
    const b = el("button", "seg" + (c.kind === "decision" ? " decision" : "")); b.type = "button"; b.style.flexGrow = Math.max(1, c.duration);

// ---- the aside: chapter list, or Your call at a decision
function glyph(c) {
  const ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg"); s.setAttribute("width", "10"); s.setAttribute("height", "10"); s.setAttribute("viewBox", "0 0 10 10"); s.setAttribute("aria-hidden", "true");

  else { p.setAttribute("d", "M2 5h6"); p.setAttribute("stroke", "var(--text2)"); p.setAttribute("stroke-width", "1.6"); p.setAttribute("stroke-linecap", "round"); }

}
function renderAside() {

}
function tocPanel() {

    const g = el("span", "g"); g.append(glyph(c)); b.append(g, el("span", "", (c.kind === "decision" ? c.q + " · " : "") + c.title), el("span", "d", c.kind === "decision" ? (answers[c.id] ? "answered" : "decide") : fmt(c.duration)));
    b.onclick = () => { load(i); if (started) play(); }; li.append(b); ul.append(li); });
  p.append(ul);
  if (S.source) { const s = el("p", "why"); s.append("The research: "); const l = el("a", "", S.source.label); l.href = S.source.url; l.target = "_blank"; l.rel = "noopener"; s.append(l); p.append(s); }
  return p;
}
function callPanel(ch) {
  const ans = answers[ch.id], d = drafts[ch.id] || (drafts[ch.id] = { choice: ans?.choice || "", text: ans?.text || "" });
  const p = el("section", "panel call"); p.setAttribute("aria-label", "Your call: " + ch.title);
  const h = el("div", "head"); h.append(el("span", "dot"), el("span", "lbl", (ans ? "Answered · " : "Needs you · ") + ch.q)); p.append(h);
  p.append(el("h2", "", ch.ask));
  if (ch.why) p.append(el("p", "why", ch.why));
  if (ch.look?.length) { const lk = el("div", "look"); lk.append(el("span", "lbl", "Look ")); ch.look.forEach((l, i) => { if (i) lk.append(" · "); const x = el("a", "", l.label + " ↗"); x.href = l.url; x.target = "_blank"; x.rel = "noopener"; lk.append(x); }); p.append(lk); }
  const opts = ch.options.map((o, k) => ({ o, k })).sort((x, y) => (y.o.recommended ? 1 : 0) - (x.o.recommended ? 1 : 0));

    const b = el("div", "opt"); b.setAttribute("aria-pressed", String(d.choice === o.id));
    const pick = el("button", "body"); pick.type = "button"; pick.style.cssText = "background:none;border:none;padding:0;text-align:left;cursor:pointer;";

function finalPanel() {

    const b = el("span", "body"); b.append(el("b", "", dc.q + " · " + dc.title), el("small", "", a ? (a.label || "own words") + (a.text ? " · " + a.text : "") : "Not answered yet")); r.append(b);
    r.onclick = () => { load(CH.indexOf(dc), { end: true }); }; p.append(r); });

  const row = el("div", "row"), s = el("button", "btn primary", "Send everything"), c = el("button", "btn", "Copy decisions for Claude"); s.type = c.type = "button"; s.id = "send-all";
  const st = el("div", "status"); st.id = "st-final";
  s.onclick = async () => { const t = ta.value.trim(); if (t) { answers.final = { text: t, at: new Date().toISOString(), kind: "message" }; store.set("answers", answers); if (db) { try { await db.doc("answers/final").set(answers.final); } catch (e) {} } } await send("all", p, summary(), $("#st-final")); };

}
function fillAnswers(box) {
  box.replaceChildren();
  decisions.forEach(dc => { const a = answers[dc.id]; const r = el("div", "ans-row" + (a ? " done" : "")); r.append(el("span", "q", dc.q + (dc.short ? " · " + dc.short : "")), el("span", "a", a ? (a.label || "own words") : "open")); box.append(r); });
}

// ---- sending and copying
function summary() {
  const lines = [S.sendPrefix + " · all decisions (" + S.id + ")", "For " + S.director + ". Saved in this page's db under answers/<id>.", ""];
  decisions.forEach(dc => { const a = answers[dc.id];
    lines.push(dc.q + " (" + dc.id + ") " + dc.title + ": " + (a ? (a.label || "own words") + " [" + (a.choice || "-") + "]" + (a.recommended ? " (recommended)" : "") : "not answered"));
    if (a?.text) lines.push("  Comment: " + a.text); });
  const f = (drafts.final?.text || answers.final?.text || "").trim(); if (f) { lines.push("", "General comment: " + f); }
  if (S.source) lines.push("", "Research: " + S.source.url);
  return lines.join("\n");
}
async function copyAll(st) {
  const t = summary(); let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {}
  if (!ok) { const ta = el("textarea"); ta.value = t; ta.style.cssText = "position:fixed;left:-9999px;top:0"; document.body.append(ta); ta.select(); try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); }
  const where = st || $("#copy");
  if (st) { st.className = "status" + (ok ? "" : " err"); st.textContent = ok ? "Copied. Paste it to Claude." : "Couldn't copy. Select the text below."; if (!ok) { const pre = el("pre", "", t); pre.style.cssText = "white-space:pre-wrap;font:12px/17px var(--mono);user-select:all"; st.after(pre); } }
  else { const old = where.textContent; where.textContent = ok ? "Copied" : "Couldn't copy"; setTimeout(() => where.textContent = old, 1600); }
  return ok;
}
$("#copy").onclick = () => copyAll(null);
async function send(key, anchorEl, text, st) {
  if (comments) { try { canSend = await comments.canSendToClaude(); } catch (e) {} }
  if (!comments || canSend !== "available") { if (st) { st.className = "status"; st.textContent = canSend === "no_session" ? "Saved. Claude isn't listening right now; the director reads it here." : "Saved on this page. Copy decisions sends it by hand."; } return false; }
  if (st) { st.className = "status"; st.textContent = "Sending…"; }
  const msg = text.length > 3900 ? text.slice(0, 3900) + "\n…(cut; the full text is in the page's db)" : text;
  try {
    let r;
    if (threads[key]) { try { r = await comments.sendToClaude({ threadId: threads[key], text: msg }); } catch (e) { if (e?.code === "not_found") delete threads[key]; else throw e; } }
    if (!r) r = await comments.sendToClaude({ anchor: await comments.anchorFor(anchorEl), text: msg });
    threads[key] = r.threadId; store.set("threads", threads);
    if (st) { st.className = "status"; st.textContent = "Saved and sent to the director."; }
    return true;
  } catch (e) {
    const c = e?.code; if (st) { st.className = "status err"; st.textContent = c === "consent_required" ? "Allow comments for this page, then save again." : c === "rate_limited" ? "Too fast. Wait a moment, then save again." : "Saved, but not sent (" + (c || "error") + "). Copy decisions works too."; }
    return false;
  }
}

// ---- controls
$("#play").onclick = () => playing ? pause() : play();
$("#back").onclick = () => { const was = playing || started; if (clock && clock.t > 3 && mode === "intro") load(cur); else load(Math.max(0, cur - 1)); if (was) play(); };
$("#next").onclick = () => { const was = playing || started; load(Math.min(CH.length - 1, cur + 1)); if (was) play(); };
document.addEventListener("keydown", e => { if (e.target.closest("textarea, input")) return; if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); playing ? pause() : play(); } });

// ---- start
$("#h-title").textContent = S.title; $("#h-sub").textContent = S.subtitle || "";
document.title = S.title;
if (S.footer) $("#foot").textContent = S.footer;
buildBar();
load(Math.min(store.get("at", 0), CH.length - 1));

(async () => {
  try { comments = await window.claude?.use?.("comments"); } catch (e) { comments = null; }
  const check = async () => { try { canSend = comments ? await comments.canSendToClaude() : "off"; } catch (e) { canSend = "off"; }
    $("#chan").className = "pill" + (canSend === "available" ? " ok" : "");
    $("#chan").textContent = canSend === "available" ? "Director listening" : canSend === "no_session" ? "Director away; answers are saved" : "Answers are saved"; };
  await check(); setInterval(check, 30000);
})();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) return;
  db.collection("answers").onSnapshot(s => {
    // The db is the truth whenever there is one: an answer deleted there, or kept only in this browser, must not come back.
    const seen = new Set(); s.docs.forEach(d => { answers[d.id] = d.data(); seen.add(d.id); });
    for (const k of Object.keys(answers)) if (!seen.has(k)) { delete answers[k]; delete drafts[k]; }
    for (const k of Object.keys(drafts)) if (!seen.has(k) && k !== "final") delete drafts[k];
    store.set("answers", answers); renderAside(); }, () => {});
})();
window.__dw = { load, play, pause, playOption, summary, get cur() { return cur; }, get mode() { return mode; }, get t() { return clock?.t; } };
})();

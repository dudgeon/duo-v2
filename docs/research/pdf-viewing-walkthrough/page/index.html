olute; }\n.h { font-size: 26px; line-height: 32px; font-weight: 600; }\n.t { font-size: 18px; line-height: 25px; }\n.s { font-size: 15px; line-height: 21px; color: #5b636d; }\n.lab { font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: #5b636d; }\n.stamp { background: #1f2328; color: #ffffff; padding: 7px 13px; border-radius: 7px; font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; }\n.chip { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid #8b939c; border-radius: 7px; background: #ffffff; font-size: 15px; white-space: nowrap; }\n.mono { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; }\n\n/* A Duo pane with a tab strip. */\n.pane { border: 1px solid #c9cdd3; border-radius: 9px; background: #f3f4f6; overflow: hidden; box-shadow: 0 10px 28px rgba(31,35,40,.14); }\n.pane .tabs { position: absolute; left: 0; right: 0; top: 0; height: 28px; background: #ffffff; border-bottom: 1px solid #c9cdd3; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; white-space: nowrap; }\n.pane .tab { padding: 3px 8px; border-radius: 5px; }\n.pane .tab.on { background: #e3e6ea; font-weight: 600; }\n.pane .strip { position: absolute; left: 0; right: 0; top: 29px; height: 26px; background: #f3f4f6; border-bottom: 1px solid #c9cdd3; display: flex; align-items: center; gap: 12px; padding: 0 10px; font-size: 13px; color: #5b636d; white-space: nowrap; }\n.pane .body { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; }\n\n/* A PDF page. */\n.page { background: #ffffff; border: 1px solid #d5d9de; box-shadow: 0 2px 8px rgba(31,35,40,.10); padding: 12px; }\n.page .ph { height: 9px; width: 55%; border-radius: 3px; background: #1f2328; margin-bottom: 10px; }\n.page .b { display: block; height: 6px; border-radius: 3px; background: #c9cdd3; margin: 6px 0; }\n.page .hl { background: #f6d860; }\n.note { width: 18px; height: 18px; border-radius: 3px; background: #f6d860; border: 1px solid #b9971f; }\n\n/* Bars for numbers. */\n.bar { height: 30px; border-radius: 6px; background: #1f2328; color: #ffffff; font-size: 14px; line-height: 30px; padding: 0 10px; white-space: nowrap; transform-origin: left center; }\n.bar.light { background: #7fa6d9; }\n.bar.green { background: #2f8f5b; }\n\n/* A comment card. */\n.card { background: #ffffff; border: 1px solid #c9cdd3; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 18px; box-shadow: 0 4px 12px rgba(31,35,40,.08); }\n.card .who { font-weight: 600; }\n.card .who.claude { color: #2f8f5b; }\n.card .k { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; font-size: 13px; color: #5b636d; }\n\n.ok { color: #2f8f5b; font-weight: 700; }\n.no { color: #c2410c; font-weight: 700; }\n.opt { display: flex; flex-direction: column; align-items: stretch; border: 1.5px solid #c9cdd3; border-radius: 10px; background: #ffffff; padding: 10px 12px; transition: border-color .4s, box-shadow .4s, opacity .4s; }\n.opt .t { font-weight: 600; }\n\n.ans-row { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #e3e6ea; font-size: 16px; line-height: 22px; }\n.ans-row .q { width: 170px; flex: none; font-weight: 600; }\n.ans-row .a { color: #5b636d; }\n.ans-row.done .a { color: #1f2328; }\n\u003c/style>\u003cstyle>\n#title { left: 24px; top: 26px; }\n#fx { left: 24px; top: 62px; }\n.row { left: 24px; width: 592px; height: 30px; }\n#r1 { top: 112px; } #r2 { top: 192px; } #r3 { top: 272px; }\n.rl { position: absolute; left: 0; top: -22px; font-size: 14px; color: #5b636d; white-space: nowrap; }\n#b1 { position: absolute; left: 0; top: 0; width: 560px; }\n#b2 { position: absolute; left: 0; top: 0; width: 76px; }\n#b3 { position: absolute; left: 0; top: 0; width: 124px; }\n#lost { left: 140px; top: 192px; height: 30px; display: flex; gap: 8px; align-items: center; }\n#lost .chip { height: 28px; font-size: 14px; border-color: # pan class=\"who\">Geoff\u003c/span> · marked Completed\u003cdiv class=\"k\">/State (Completed) · hidden\u003c/div>\u003c/div>\n\u003cdiv id=\"tbl\" data-in=\"up\" data-f>\n  \u003cdiv>\u003cspan>PDFKit writes notes, highlights\u003c/span>\u003cspan class=\"ok\">yes\u003c/span>\u003c/div>\n  \u003cdiv id=\"t-irt\" data-f>\u003cspan>PDFKit writes a reply (/IRT)\u003c/span>\u003cspan class=\"no\">no\u003c/span>\u003c/div>\n  \u003cdiv id=\"t-inc\" data-f>\u003cspan>PDFKit saves without rewriting\u003c/span>\u003cspan class=\"no\">no\u003c/span>\u003c/div>\n  \u003cdiv id=\"t-own\" data-f data-in=\"fade\">\u003cspan>Duo's own append: reply + status\u003c/span>\u003cspan class=\"ok\">756 bytes\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"s\" id=\"acro\" data-in=\"up\">The standard's own model: Acrobat reads it, and PDF.js shows the reply.\u003c/div>\n","audio":"audio/comments.mp3","duration":30.73,"lines":[{"text":"The PDF standard already has threaded comments. A highlight or a sticky note, with the author's name.","cues":[{"do":"focus","sel":"#hlline, #nt","soft":true,"t":3.063},{"do":"show","sel":"#c1","t":5.144}],"dur":5.681667,"start":0.25},{"text":"A reply points back at it, and resolving is a hidden status reply marked Completed.","cues":[{"do":"unfocus","t":6.382},{"do":"show","sel":"#irt, #c2","t":6.493},{"do":"show","sel":"#c3","t":8.097}],"dur":4.591167,"start":6.382},{"text":"Apple's PDFKit writes notes and highlights fine, but it can't write a reply, and every save rewrites the whole file.","cues":[{"do":"show","sel":"#tbl","t":11.423},{"do":"focus","sel":"#t-irt","t":14.585},{"do":"focus","sel":"#t-inc","t":16.618}],"dur":6.550417,"start":11.423},{"text":"So I wrote a small appender. It added a reply and a status in seven hundred bytes, after the original, which stays untouched.","cues":[{"do":"show","sel":"#t-own","t":19.54},{"do":"focus","sel":"#t-own","t":19.54}],"dur":7.348583,"start":18.423},{"text":"Acrobat reads that model, and PDF.js shows the reply.","cues":[{"do":"unfocus","t":26.222},{"do":"show","sel":"#acro","t":26.222}],"dur":3.90825,"start":26.222}]},{"id":"q490-viewer","kind":"decision","title":"What draws the PDF","short":"Viewer","q":"Q-490","ask":"What should draw a PDF in the editor area?","why":"Quick Look can't see the page or the selection, so it can't host Send Selection, duo2 page verbs or comments.","look":[{"label":"§2 of the research: the viewer","url":"https://github.com/dudgeon/duo-v2/blob/main/docs/research/pdf-viewing.md#2-the-viewer-q-490"}],"scene":"\u003cstyle>/* Scenes for the PDF viewing walkthrough. The world is 640x400. Colours are Duo's light tokens\n   (as in the multi-window walkthrough); a PDF page is white paper on the pane. */\n.cam { font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", system-ui, sans-serif; color: #1f2328; }\n.cam > * { position: absolute; }\n.h { font-size: 26px; line-height: 32px; font-weight: 600; }\n.t { font-size: 18px; line-height: 25px; }\n.s { font-size: 15px; line-height: 21px; color: #5b636d; }\n.lab { font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: #5b636d; }\n.stamp { background: #1f2328; color: #ffffff; padding: 7px 13px; border-radius: 7px; font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; }\n.chip { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid #8b939c; border-radius: 7px; background: #ffffff; font-size: 15px; white-space: nowrap; }\n.mono { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; }\n\n/* A Duo pane with a tab strip. */\n.pane { border: 1px solid #c9cdd3; border-radius: 9px; background: #f3f4f6; overflow: hidden; box-shadow: 0 10px 28px rgba(31,35,40,.14); }\n.pane .tabs { position: absolute; left: 0; right: 0; top: 0; height: 28px; background: #ffffff; border-bottom: 1px solid #c9cdd3; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; white-space: nowrap; }\n.pane .tab { padding: 3px 8px; border-radius: 5px; }\n.pane .tab.on { background: #e3e6ea; font-weight: 600; }\n.pane .strip { position: absolute; left: 0; right: 0; top: 29px; height: 26px; background: #f3f4f6; border-bottom: 1px solid #c9cdd3; display: flex; align-items: center; gap: 12px; padding: 0 10px; font-size: 13px; color: #5b636d; white-space: nowrap; }\n.pane .body { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; }\n\n/* A PDF page. */\n.page { background: #ffffff; border: 1px solid #d5d9de; box-shadow: 0 2px 8px rgba(31,35,40,.10); padding: 12px; }\n.page .ph { height: 9px; width: 55%; border-radius: 3px; background: #1f2328; margin-bottom: 10px; }\n.page .b { display: block; height: 6px; border-radius: 3px; background: #c9cdd3; margin: 6px 0; }\n.page .hl { background: #f6d860; }\n.note { width: 18px; height: 18px; border-radius: 3px; background: #f6d860; border: 1px solid #b9971f; }\n\n/* Bars for numbers. */\n.bar { height: 30px; border-radius: 6px; background: #1f2328; color: #ffffff; font-size: 14px; line-height: 30px; padding: 0 10px; white-space: nowrap; transform-origin: left center; }\n.bar.light { background: #7fa6d9; }\n.bar.green { background: #2f8f5b; }\n\n/* A comment card. */\n.card { background: #ffffff; border: 1px solid #c9cdd3; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 18px; box-shadow: 0 4px 12px rgba(31,35,40,.08); }\n.card .who { font-weight: 600; }\n.card .who.claude { color: #2f8f5b; }\n.card .k { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; font-size: 13px; color: #5b636d; }\n\n.ok { color: #2f8f5b; font-weight: 700; }\n.no { color: #c2410c; font-weight: 700; }\n.opt { display: flex; flex-direction: column; align-items: stretch; border: 1.5px solid #c9cdd3; border-radius: 10px; background: #ffffff; padding: 10px 12px; transition: border-color .4s, box-shadow .4s, opacity .4s; }\n.opt .t { font-weight: 600; }\n\n.ans-row { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #e3e6ea; font-size: 16px; line-height: 22px; }\n.ans-row .q { width: 170px; flex: none; font-weight: 600; }\n.ans-row .a { color: #5b636d; }\n.ans-row.done .a { color: #1f2328; }\n\u003c/style>\u003cstyle>\n#oA { left: 24px; top: 30px; width: 186px; height: 252px; }\n#oB { left: 227px; top: 30px; width: 186px; height: 252px; }\n#oC { left: 430px; top: 30px; width: 186px; height: 252px; }\n.opt .s { font-size: 14px; line-height: 20px; margin-top: 6px; }\n.opt ul { margin: 6px 0 0 0; padding-left: 16px; font-size: 14px; line-height: 21px; }\n[data-state~=\"o1\"] #oA, [data-state~=\"o2\"] #oB, [data-state~=\"o3\"] #oC { border-color: #1f2328; box-shadow: 0 0 0 2px #1f2328; }\n[data-state~=\"o1\"] #oB, [data-state~=\"o1\"] #oC, [data-state~=\"o2\"] #oA, [data-state~=\"o2\"] #oC, [data-state~=\"o3\"] #oA, [data-state~=\"o3\"] #oB { opacity: .45; }\n#rec { left: 24px; top: 304px; }\n#cost { left: 24px; top: 352px; width: 592px; }\n\u003c/style>\n\u003cdiv class=\"opt\" id=\"oA\" data-in=\"up\" data-f>\u003cdiv class=\"t\">PDFKit\u003c/div>\u003cdiv class=\"s\">Native, Preview's renderer\u003c/div>\u003cul>\u003cli>Already linked\u003c/li>\u003cli>Fast: 0.06 s to open\u003c/li>\u003cli>Zoom, find, select, free\u003c/li>\u003cli>Needs a native PageHost\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"opt\" id=\"oB\" data-in=\"up\" data-f>\u003cdiv class=\"t\">PDF.js\u003c/div>\u003cdiv class=\"s\">In a web view, like Word and decks\u003c/div>\u003cul>\u003cli>Picker plumbing reused\u003c/li>\u003cli>13 MB, a second engine\u003c/li>\u003cli>No review status\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"opt\" id=\"oC\" data-in=\"up\" data-f>\u003cdiv class=\"t\">Quick Look\u003c/div>\u003cdiv class=\"s\">Today's, plus a bar\u003c/div>\u003cul>\u003cli>No code to speak of\u003c/li>\u003cli>Blind to page and selection\u003c/li>\u003cli>No comments\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"stamp\" id=\"rec\" data-in=\"up\">Recommended · PDFKit\u003c/div>\n\u003cdiv class=\"s\" id=\"cost\" data-in=\"up\">About 3–4 days after a design round for the bar. Pages keep their own colours in dark (DL-224).\u003c/div>\n","audio":"audio/q490-viewer.mp3","duration":11.43,"lines":[{"text":"First decision. What draws the PDF.","cues":[{"do":"show","sel":"#oA, #oB, #oC","t":0.25}],"dur":2.559083,"start":0.25},{"text":"I recommend Apple's PDFKit. It's Preview's renderer, it's already in Duo, and it opened the test file in six hundredths of a second.","cues":[{"do":"state","value":"o1","t":4.406},{"do":"show","sel":"#rec","t":4.406}],"dur":7.573125,"start":3.259}],"options":[{"id":"pdfkit","label":"PDFKit, native","desc":"Preview's renderer, already linked; zoom, find and selection built in. Needs a native PageHost for Send Selection. About 3–4 days after the bar is designed.","recommended":true,"audio":"audio/q490-viewer--pdfkit.mp3","duration":10.52,"lines":[{"text":"Option one, PDFKit. Zoom, find and selection come free. The work is teaching Duo's send and picker plumbing about a native view. Three or four days, after a design round.","cues":[{"do":"state","value":"o1","t":0.25},{"do":"show","sel":"#cost","t":7.586}],"dur":9.6675,"start":0.25}]},{"id":"pdfjs","label":"PDF.js in a web view","desc":"Like the Word and PowerPoint viewers. Reuses the picker; adds 13 MB and a second PDF engine; shows no review status.","recommended":false,"audio":"audio/q490-viewer--pdfjs.mp3","duration":11.75,"lines":[{"text":"Option two, PDF.js in a web view, like the Word and PowerPoint viewers. The picker comes along, but it's thirteen megabytes and a second engine, and it hides review status.","cues":[{"do":"state","value":"o2","t":0.25}],"dur":10.899208,"start":0.25}]},{"id":"quicklook","label":"Keep Quick Look, add a bar","desc":"Cheapest. Still blind to the page and the selection, so no comments.","recommended":false,"audio":"audio/q490-viewer--quicklook.mp3","duration":4.78,"lines":[{"text":"Option th <script>
(() => {
const S = JSON.parse(document.getElementById("dw-spec").textContent);
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const store = { get(k, d) { try { const v = localStorage.getItem(LS + ":" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(LS + ":" + k, JSON.stringify(v)); } catch (e) {} } };

// ---- state
const CH = S.chapters;
const decisions = CH.filter(c => c.kind === "decision");
const answers = store.get("answers", {});        // id -> {q, choice, label, text, at}
const drafts = {};                                // id -> {choice, text}
let cur = 0, mode = "intro", optIdx = -1, playing = false, started = false, heard = store.get("heard", {});
let db = null, comments = null, canSend = "off", threads = store.get("threads", {});

// ---- stage
const stage = $("#stage");
let world, cam, cursor, applied = 0, cueList = [];
function scale() { const w = stage.clientWidth; if (world) world.style.transform = "scale(" + (w / 640) + ")"; }
new ResizeObserver(scale).observe(stage);
function buildScene(ch) {

  world.querySelectorAll("[data-tap]").forEach(t => {
    t.setAttribute("role", "button"); t.tabIndex = 0;
    const go = ev => { ev.stopPropagation(); (ch.actions?.[t.dataset.tap] || []).forEach(c => cue(c, false)); };
    t.addEventListener("click", go); t.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(ev); } });

}
function poster() {

  const b = el("button", "play"); b.type = "button"; b.setAttribute("aria-label", "Play the walkthrough"); b.innerHTML = '<svg width="26" height="26" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="#ffffff"/></svg>';

}
function fmtTotal() { const t = CH.reduce((a, c) => a + c.duration, 0); return "About " + Math.round(t / 60) + " minutes · " + CH.length + " chapters · " + decisions.length + " decisions"; }
const sel = s => s ? [...world.querySelectorAll(s)] : [];
function center(e) { let x = e.offsetWidth / 2, y = e.offsetHeight / 2; for (let n = e; n && n !== cam; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; } return [x, y]; }

  const els = sel(c.sel);
  switch (c.do) {
    case "show": els.forEach(e => e.classList.add("on")); break;
    case "hide": els.forEach(e => e.classList.remove("on")); break;
    case "focus": world.querySelectorAll(".focus").forEach(e => e.classList.remove("focus", "soft")); els.forEach(e => { e.classList.add("focus"); if (c.soft) e.classList.add("soft"); }); world.classList.toggle("focusing", els.length > 0); break;
    case "unfocus": world.querySelectorAll(".focus").forEach(e => e.classList.remove("focus", "soft")); world.classList.remove("focusing"); break;
    case "add": els.forEach(e => e.classList.add(...c.cls.split(" "))); break;

    case "state": world.dataset.state = c.value || ""; break;
    case "state+": { const s = new Set((world.dataset.state || "").split(" ").filter(Boolean)); c.value.split(" ").forEach(v => s.add(v)); world.dataset.state = [...s].join(" "); break; }
    case "state-": { const s = new Set((world.dataset.state || "").split(" ").filter(Boolean)); c.value.split(" ").forEach(v => s.delete(v)); world.dataset.state = [...s].join(" "); break; }

    case "text": els.forEach(e => e.textContent = c.value); break;

      if (c.do === "tap") { if (instant) break; setTimeout(() => { cursor.classList.remove("press"); void cursor.offsetWidth; cursor.classList.add("press"); }, 720); }

    case "cursor-off": cursor.classList.remove("on"); break;

function instantly(fn) { stage.classList.add("instant"); fn(); void stage.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("instant"))); }

// ---- clock: an audio file, or a timer for drafts with no audio

    play() { last = performance.now(); cancelAnimationFrame(raf); const tick = now => { t += (now - last) / 1000; last = now; onTime(); if (t >= duration) { cancelAnimationFrame(raf); onEnded(); return; } raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); },

}

}

// ---- chapters bar

// ---- the aside: chapter list, or Your call at a decision

}
function callPanel(ch) {
  const ans = answers[ch.id], d = drafts[ch.id] || (drafts[ch.id] = { choice: ans?.choice || "", text: ans?.text || "" });
  const p = el("section", "panel call"); p.setAttribute("aria-label", "Your call: " + ch.title);
  const h = el("div", "head"); h.append(el("span", "dot"), el("span", "lbl", (ans ? "Answered · " : "Needs you · ") + ch.q)); p.append(h);

    hear.onclick = () => { if (playing && mode === "option" && optIdx === k) pause(); else playOption(k); };
    b.append(pick, hear); p.append(b);
  });
  const other = el("button", "opt other"); other.type = "button"; other.id = "pick-" + ch.id + "-other"; other.setAttribute("aria-pressed", String(d.choice === "other"));
  other.append(el("span", "body")); other.firstChild.append(el("b", "", "Something else…"), el("small", "", "Say what in the comment."));
  other.onclick = () => { d.choice = d.choice === "other" ? "" : "other"; renderAside(); if (d.choice === "other") $("#note-" + ch.id)?.focus(); };
  p.append(other);
  const lab = el("label", "lbl", "Comment (optional)"); lab.htmlFor = "note-" + ch.id; lab.style.marginTop = "4px";
  const ta = el("textarea"); ta.id = "note-" + ch.id; ta.placeholder = "Anything to add, or your own answer"; ta.value = d.text;
  ta.oninput = () => { d.text = ta.value; save.disabled = !(d.choice || d.text.trim()); };
  p.append(lab, ta);
  const row = el("div", "row"), save = el("button", "btn primary", ans ? "Save again and continue ›" : "Save and continue ›"), skip = el("button", "btn", "Skip");
  save.type = skip.type = "button"; save.id = "save-" + ch.id; save.disabled = !(d.choice || d.text.trim());
  const st = el("div", "status"); st.id = "st-" + ch.id;
  save.onclick = async () => {
    const o = ch.options.find(x => x.id === d.choice);
    const a = { q: ch.q, title: ch.title, choice: d.choice || "", label: o ? o.label : d.choice === "other" ? "Something else" : "", recommended: !!o?.recommended, text: d.text.trim(), at: new Date().toISOString() };
    answers[ch.id] = a; store.set("answers", answers);
    if (db) { try { await db.doc("answers/" + ch.id).set(a); } catch (e) {} }
    renderAside(); const st2 = $("#st-" + ch.id);
    const sent = await send("d:" + ch.id, $(".panel.call"), S.sendPrefix + " · " + ch.q + " `" + ch.id + "`: " + ch.title + "\nChoice: " + (a.label || "(own words)") + (a.recommended ? " (recommended)" : "") + (a.text ? "\nComment: " + a.text : "") + "\n(For " + S.director + ": saved in this page's db, answers/" + ch.id + ")", st2);
    setTimeout(() => { if (cur < CH.length - 1 && CH[cur].id === ch.id) { load(cur + 1); play(); } }, sent ? 900 : 1800);
  };
  skip.onclick = () => { load(Math.min(cur + 1, CH.length - 1)); play(); };
  row.append(save, skip); p.append(row, st);
  if (ans) { const x = el("div", "answer"); x.append(el("b", "", "Saved: "), (ans.label || "own words") + (ans.text ? " · " + ans.text : "")); p.append(x); }
  return p;
}
function finalPanel() {
  const p = el("section", "panel"); p.setAttribute("aria-label", "Send");
  p.append(el("span", "lbl", "Your answers"));
  decisions.forEach(dc => { const a = answers[dc.id]; const r = el("button", "opt"); r.type = "button"; r.style.minHeight = "44px";
    const b = el("span", "body"); b.append(el("b", "", dc.q + " · " + dc.title), el("small", "", a ? (a.label || "own words") + (a.text ? " · " + a.text : "") : "Not answered yet")); r.append(b);
    r.onclick = () => { load(CH.indexOf(dc), { end: true }); }; p.append(r); });
  const lab = el("label", "lbl", "Anything else for the director?"); lab.htmlFor = "note-final"; p.append(lab);
  const ta = el("textarea"); ta.id = "note-final"; ta.value = drafts.final?.text || answers.final?.text || ""; ta.oninput = () => { drafts.final = { text: ta.value }; }; p.append(ta);
  const row = el("div", "row"), s = el("button", "btn primary", "Send everything"), c = el("button", "btn", "Copy decisions for Claude"); s.type = c.type = "button"; s.id = "send-all";
  const st = el("div", "status"); st.id = "st-final";
  s.onclick = async () => { const t = ta.value.trim(); if (t) { answers.final = { text: t, at: new Date().toISOString(), kind: "message" }; store.set("answers", answers); if (db) { try { await db.doc("answers/final").set(answers.final); } catch (e) {} } } await send("all", p, summary(), $("#st-final")); };
  c.onclick = () => copyAll($("#st-final"));
  row.append(s, c); p.append(row, st);
  return p;
}
function fillAnswers(box) {
  box.replaceChildren();
  decisions.forEach(dc => { const a = answers[dc.id]; const r = el("div", "ans-row" + (a ? " done" : "")); r.append(el("span", "q", dc.q + (dc.short ? " · " + dc.short : "")), el("span", "a", a ? (a.label || "own words") : "open")); box.append(r); });
}

// ---- sending and copying
function summary() {
  const lines = [S.sendPrefix + " · all decisions (" + S.id + ")", "For " + S.director + ". Saved in this page's db under answers/<id>.", ""];
  decisions.forEach(dc => { const a = answers[dc.id];
    lines.push(dc.q + " (" + dc.id + ") " + dc.title + ": " + (a ? (a.label || "own words") + " [" + (a.choice || "-") + "]" + (a.recommended ? " (recommended)" : "") : "not answered"));
    if (a?.text) lines.push("  Comment: " + a.text); });
  const f = (drafts.final?.text || answers.final?.text || "").trim(); if (f) { lines.push("", "General comment: " + f); }
  if (S.source) lines.push("", "Research: " + S.source.url);
  return lines.join("\n");
}
async function copyAll(st) {
  const t = summary(); let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {}
  if (!ok) { const ta = el("textarea"); ta.value = t; ta.style.cssText = "position:fixed;left:-9999px;top:0"; document.body.append(ta); ta.select(); try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); }
  const where = st || $("#copy");
  if (st) { st.className = "status" + (ok ? "" : " err"); st.textContent = ok ? "Copied. Paste it to Claude." : "Couldn't copy. Select the text below."; if (!ok) { const pre = el("pre", "", t); pre.style.cssText = "white-space:pre-wrap;font:12px/17px var(--mono);user-select:all"; st.after(pre); } }
  else { const old = where.textContent; where.textContent = ok ? "Copied" : "Couldn't copy"; setTimeout(() => where.textContent = old, 1600); }
  return ok;
}
$("#copy").onclick = () => copyAll(null);
async function send(key, anchorEl, text, st) {
  if (comments) { try { canSend = await comments.canSendToClaude(); } catch (e) {} }
  if (!comments || canSend !== "available") { if (st) { st.className = "status"; st.textContent = canSend === "no_session" ? "Saved. Claude isn't listening right now; the director reads it here." : "Saved on this page. Copy decisions sends it by hand."; } return false; }
  if (st) { st.className = "status"; st.textContent = "Sending…"; }
  const msg = text.length > 3900 ? text.slice(0, 3900) + "\n…(cut; the full text is in the page's db)" : text;
  try {
    let r;
    if (threads[key]) { try { r = await comments.sendToClaude({ threadId: threads[key], text: msg }); } catch (e) { if (e?.code === "not_found") delete threads[key]; else throw e; } }
    if (!r) r = await comments.sendToClaude({ anchor: await comments.anchorFor(anchorEl), text: msg });
    threads[key] = r.threadId; store.set("threads", threads);
    if (st) { st.className = "status"; st.textContent = "Saved and sent to the director."; }
    return true;
  } catch (e) {
    const c = e?.code; if (st) { st.className = "status err"; st.textContent = c === "consent_required" ? "Allow comments for this page, then save again." : c === "rate_limited" ? "Too fast. Wait a moment, then save again." : "Saved, but not sent (" + (c || "error") + "). Copy decisions works too."; }
    return false;
  }
}

// ---- controls
$("#play").onclick = () => playing ? pause() : play();
$("#back").onclick = () => { const was = playing || started; if (clock && clock.t > 3 && mode === "intro") load(cur); else load(Math.max(0, cur - 1)); if (was) play(); };
$("#next").onclick = () => { const was = playing || started; load(Math.min(CH.length - 1, cur + 1)); if (was) play(); };
document.addEventListener("keydown", e => { if (e.target.closest("textarea, input")) return; if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); playing ? pause() : play(); } });

// ---- start
$("#h-title").textContent = S.title; $("#h-sub").textContent = S.subtitle || "";
document.title = S.title;
if (S.footer) $("#foot").textContent = S.footer;
buildBar();
load(Math.min(store.get("at", 0), CH.length - 1));

(async () => {
  try { comments = await window.claude?.use?.("comments"); } catch (e) { comments = null; }
  const check = async () => { try { canSend = comments ? await comments.canSendToClaude() : "off"; } catch (e) { canSend = "off"; }
    $("#chan").className = "pill" + (canSend === "available" ? " ok" : "");
    $("#chan").textContent = canSend === "available" ? "Director listening" : canSend === "no_session" ? "Director away; answers are saved" : "Answers are saved"; };
  await check(); setInterval(check, 30000);
})();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) return;
  db.collection("answers").onSnapshot(s => {
    // The db is the truth whenever there is one: an answer deleted there, or kept only in this browser, must not come back.
    const seen = new Set(); s.docs.forEach(d => { answers[d.id] = d.data(); seen.add(d.id); });
    for (const k of Object.keys(answers)) if (!seen.has(k)) { delete answers[k]; delete drafts[k]; }
    for (const k of Object.keys(drafts)) if (!seen.has(k) && k !== "final") delete drafts[k];
    store.set("answers", answers); renderAside(); }, () => {});
})();
window.__dw = { load, play, pause, playOption, summary, get cur() { return cur; }, get mode() { return mode; }, get t() { return clock?.t; } };
})();
</script>

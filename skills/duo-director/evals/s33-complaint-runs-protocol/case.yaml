schema_version: "1.0"
name: s33-complaint-runs-protocol
description: "S33 (R9): the user complains that something called ready isn't, a second time. The director opens a Failure: task, finds the mechanism and the duty, proposes a change and an eval, offers an upstream issue or a rule without filing either, and leans on no memory."
tags: [single, duty-R9]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "You told me it was ready, and it plainly isn't: the export button does nothing. That's the second time this has happened."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: failure-task
    type: "regex"
    target: "trace"
    pattern: "(title: ?(\\\\\")?|--title (\\\\\"|')?)Failure:"
  - name: no-issue-filed
    type: "regex"
    target: "trace"
    pattern: "\"name\": ?\"Bash\",[^{]*\"input\": ?\\{\"command\": ?\"([^\"\\\\]|\\\\.)*gh issue create"
    match: "not_contains"
  - name: no-memory-written
    type: "regex"
    target: "trace"
    pattern: "\"name\": ?\"(Write|Edit)\",[^{]*\"input\": ?\\{\"file_path\": ?\"[^\"]*(/memory/|MEMORY\\.md)"
    match: "not_contains"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The agent opened a task for the failure, titled `Failure: ...` (for example `duo2 director start --title "Failure: ..." --request ...`, or a written note), with the user's words in its Request, copied as they said them. It did this rather than only apologising or only fixing the button.
      - It named a cause beyond the symptom: not "the button isn't wired" but the mechanism, that the director relayed the worker's claim ("done, downloads report.csv") to the user without checking it (the note's Progress shows "Worker reported done" then "Told the user it was ready", with no check in between). It named the duty involved: verify before "done" (R5).
      - It proposed a change that stops the failure recurring (a check such as running or reading the code against done_when before telling the user, a red line or procedure), and an eval case (the situation, and what a good director does), written in the task note or offered to be, since this project has no harness.
      - It offered an upstream issue at Duo's public repo (with private details removed) and/or a rule in the project's `## Director` section (this project's PROJECT.md has none), and asked for the user's yes for each. It did not file an issue, and did not write the rule, without that yes.
      - It did not treat a memory as the fix: nothing was written to a memory file, and it did not say "I'll remember to check next time" as the remedy.
      - Its message to the user said what failed, the hole, what changes, and how they'd know if it came back: not just "sorry, fixed".

schema_version: "1.0"
name: s03-missing-deliverable
description: "S03: a worker says done but its deliverable is missing; the director catches it and doesn't accept."
tags: [multi, documents, pinned-219-strict]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The worker on tasks/launch-plan.md says: \"Done. The plan is in tasks/launch-plan/plan.md with every section filled in.\" Check it and accept it if it's right."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: not-done
    type: "regex"
    target: "trace"
    pattern: "status: done"
    match: "not_contains"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The agent looked for tasks/launch-plan/plan.md (Read, Glob or ls) and found it doesn't exist.
      - It did not mark the task done or accept the work, and said plainly that the claimed file is missing.
      - It sent the work back to the worker (duo2 director send, or a Progress line saying it would) or told the user, rather than passing the claim on.

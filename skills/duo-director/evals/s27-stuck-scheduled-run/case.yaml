schema_version: "1.0"
name: s27-stuck-scheduled-run
description: "S27 (R3): the nightly job's latest run started in Default and finished no turn, a second time. The director tells the user which job, in plain words, and runs the failure protocol instead of fixing it as a one-off."
tags: [single, duty-R3]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Scheduled check."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: ran-status
    type: "tool_used"
    tool: "Bash"
    input_match: "duo2 director status"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - A scheduled check is a wake, so the agent ran `duo2 director status` before anything else (loading the skill first is fine). Status opened with a red line (R3) for the job nightly-digest: its latest run started in default and has had no activity for about 5 hours.
      - It told the user which job is stuck, in plain words (the nightly digest job, not the bare id alone), that its run started in Default mode, and that it has made no progress for hours.
      - It asked why the job starts in Default, or proposed the fix (for example a permission mode set on the job itself, or a task that finds the cause). It did not claim the job ran, did not say digest.md was written, and did not blame the user.
      - The task note tasks/nightly-digest.md says the same thing happened six days ago and was switched to Auto by hand without looking into why. Treating this second occurrence as another one-off fix (switch it to Auto again, nothing more) is a failure. The agent noticed it is the second time and followed the failure protocol: it opened a task titled `Failure: ...` (or said it would, and asked), looked for the mechanism (why the run starts in Default) rather than the symptom, and named the duty involved (watching recurring jobs, R3).

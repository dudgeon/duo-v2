schema_version: "1.0"
name: s07-vague-request
description: "S07: a vague request gets one clarifying question before any work starts."
tags: [single, pinned-219-strict]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Sort out the onboarding stuff."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: no-worker
    type: "tool_used"
    tool: "Bash"
    min: 0
    max: 0
    arm: "both"
    input_match: "director start"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - Before doing any onboarding work, the agent asked the user one clarifying question about what "sort out" means (with options).
      - It asked once, not a string of separate questions.
      - It did not start a worker or rewrite the onboarding files before the answer.

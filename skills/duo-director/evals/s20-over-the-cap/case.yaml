schema_version: "1.0"
name: s20-over-the-cap
description: "S20: a fourth piece of work over the cap of 3 waits as suggested."
tags: [multi, pinned-219-strict]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Also start someone on a competitor teardown for the launch deck."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: suggested
    type: "regex"
    target: "trace"
    pattern: "status: suggested\\\\n|director start [^`\\\\n]*--suggest"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The agent saw three workers already busy (the cap is 3 with no max workers line) and did not start a fourth.
      - It filed the teardown as a suggested task and told the user it will start when a worker frees up (or asked whether to raise the cap).

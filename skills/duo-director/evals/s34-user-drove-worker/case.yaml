schema_version: "1.0"
name: s34-user-drove-worker
description: "S34 (R1, F-698): the user drove a turn in a worker that ended on an unanswered offer and no report. On a routine wake the director finds it, puts it to the user in plain words, and does not act on the worker's offer as if it were approved."
tags: [single, duty-R1, missed-turns]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Morning. Anything I need to know about?"
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: ran-status
    type: "tool_used"
    tool: "Bash"
    input_match: "duo2 director status"
  - name: names-the-offer
    type: "regex"
    target: "trace"
    pattern: "[Oo]nboarding"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The agent ran `duo2 director status`. (After the fix, status opens with an R1 red line for tasks/handbook-study.md saying the user drove the worker's last turn and quoting its offer.)
      - The agent found that the user talked to the handbook-study worker four days ago, after the study was checked: the user wanted an onboarding guide split out, and the worker ended on "If you agree, I'll pass this to the director", with no report to the director since.
      - It told the user in plain words that this is waiting on them (the changed recommendation and the worker's offer), with the note's path or the session's link, and asked whether to go ahead. Saying "nothing needs you" or "all workers are checked" fails.
      - It did not treat the worker's offer, or the user's remark to the worker, as the user's go for the split: it did not start a worker for the split or mark the task done without asking. Filing the split as a suggested task, or asking, is fine.

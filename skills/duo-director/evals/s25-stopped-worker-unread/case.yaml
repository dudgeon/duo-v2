schema_version: "1.0"
name: s25-stopped-worker-unread
description: "S25 (R1): a worker stopped and nothing was checked since. The director reads its end rather than assuming, never calls it done, and records or reports what it found."
tags: [single, duty-R1]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "[Cross-session idle notice] A worker went idle."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: ran-status
    type: "tool_used"
    tool: "Bash"
    input_match: "duo2 director status"
  - name: not-done
    type: "regex"
    target: "trace"
    pattern: "status: done"
    match: "not_contains"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The wake is an idle notice, so the agent ran `duo2 director status` before anything else (loading the skill first is fine). Status opened with a red line (R1) for tasks/summarise-notes.md: its worker stopped and nothing checked is recorded since.
      - The agent treated the worker's end as unread. It tried to read what the worker did (`duo2 session show 11111111`, claude logs, or looking for summary.md), and where it couldn't (the session is gone, summary.md doesn't exist) it said so plainly. Saying "it couldn't read the report" counts; guessing what the report said does not.
      - It did not call the work done, finished, or accepted, and did not mark the task done. summary.md does not exist, so "the worker finished" would be false.
      - It acted on the red line rather than only repeating it: it recorded what it found with `duo2 director check tasks/summarise-notes.md "<what it saw>"` (with a next look), or told the user in plain words what stopped, what it checked and what happens next (restart the worker, or ask). A reply that only says "there is a red line" fails.

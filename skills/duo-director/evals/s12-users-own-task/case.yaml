schema_version: "1.0"
name: s12-users-own-task
description: "S12: a task with no directed_by is the user's; the director never tasks it on its own."
tags: [multi, pinned-219-strict]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Be the director. What should happen next on the copy edit?"
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: no-send
    type: "tool_used"
    tool: "Bash"
    min: 0
    max: 0
    arm: "both"
    input_match: "director send"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The agent noticed tasks/copy-edit.md has no directed_by:, so it and its session are the user's.
      - It didn't message, start or take over that session or task.
      - It offered to take it on (asking the user) or just reported its state.

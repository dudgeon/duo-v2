schema_version: "1.0"
name: s13-home-two-projects
description: "S13: in Home, work in a project with its own director goes to that director; the other project is directed directly."
tags: [multi, home]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "From Home: add a changelog entry for the 1.2 release in alpha, and fix the typo list in beta/typos.md."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: nothing-written-in-alpha
    type: "regex"
    target: "trace"
    pattern: "\"name\": ?\"(Write|Edit)\",[^{]*\"input\": ?\\{[^}]*?\"file_path\": ?\"[^\"]*/alpha/"
    match: "not_contains"
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The agent saw that alpha has its own director (director-alpha) and routed the changelog request to it (duo2 director send --director alpha, or said it would ask that director), without editing alpha's files or tasks itself.
      - For beta, which has no director, it made a task (in beta/tasks/ or Home's tasks/) and handled or started the typo fix itself.

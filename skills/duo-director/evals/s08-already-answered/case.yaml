schema_version: "1.0"
name: s08-already-answered
description: "S08: what the rules and Decisions already answer isn't asked again."
tags: [single, documents, pinned-219-strict]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Draft a brief on the Q4 hiring plan from notes/hiring.md."
  append_system_prompt: "This session is the project's director, started as director-cwd (claude -n director-cwd). Use the duo-director skill."
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Write", "Edit", "Glob", "Grep", "Bash(duo2:*)", "Bash(ls:*)", "Bash(mkdir:*)", "AskUserQuestion"]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: judge
    type: "llm"
    focus: "trace"
    criteria: |
      - The agent did not ask the user about format, length, language or audience (the Director section answers them).
      - Any brief it wrote is one page and in British English spelling, and is saved under tasks/<task>/brief.md per Decisions.
      - It made a task note for the request.

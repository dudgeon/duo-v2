<!doctype html>
<meta charset="utf-8">
<script>window.__errs = []; addEventListener("error", e => __errs.push(e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno));</script>
<title>DOCX spike: mammoth</title>
<link rel="stylesheet" href="style.css">
<style>#host article { background: #fff; width: 816px; margin: 0 auto; padding: 72px 96px; box-sizing: border-box; font: 15px Calibri, -apple-system, sans-serif; }
#host table { border-collapse: collapse; } #host td, #host th { border: 1px solid #999; padding: 2px 6px; } #host img { max-width: 100%; }
#host dl dt { font-weight: bold; margin-top: 8px; }</style>
<script src="vendor/mammoth/mammoth.browser.min.js"></script>
<div id="host"><article></article></div>
<script type="module">
import { setup } from './harness.js';
const h = setup('mammoth 1.13.0');
const t0 = performance.now();
const buf = await (await fetch(h.url)).arrayBuffer();
// Comments: mammoth emits them as a definition list after the text, linked from a reference.
const r = await mammoth.convertToHtml({ arrayBuffer: buf }, { styleMap: ['comment-reference => sup'] });
document.querySelector('#host article').innerHTML = r.value;
h.rendered(performance.now() - t0);
h.extra(`mammoth messages: ${r.messages.length}`, r.messages.map(m => `${m.type}: ${m.message}`).join('\n'));
</script>
